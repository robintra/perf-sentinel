# Measured per-service energy from an Alumet agent.
# Kubernetes port of examples/30-green-alumet.toml.
#
# Stack on the base values, never alone:
#   helm install perf-sentinel ../../charts/perf-sentinel \
#     --namespace observability \
#     -f values-perf-sentinel.yaml -f values-green-alumet.yaml
#
# Everything not listed here keeps its default. Full key list, defaults and
# ranges: examples/perf-sentinel.toml, or
# https://perf-sentinel.dev/docs/CONFIGURATION
#
# Prerequisites:
#   - An Alumet agent as a DaemonSet, running `rapl` + `k8s` +
#     `energy-attribution` + `prometheus-exporter`. `rapl` alone measures the
#     whole machine and cannot attribute per service.
#   - Nodes where RAPL is readable. That rules out most managed cloud node
#     pools, which expose no MSR: use values-green-cloud.yaml there.
#   - The agent reachable from the perf-sentinel pod, so a Service in front of
#     the DaemonSet rather than a hostPort.
#
# /!\ One endpoint, one node. Alumet runs per node and the Service below is a
# ClusterIP, so each scrape is load-balanced to one arbitrary agent and returns
# that node's cgroups only. On a single-node cluster that is the whole cluster.
# On a multi-node cluster the energy attributed jumps between nodes and
# under-reports without ever failing. The scraper reads any endpoint serving
# Prometheus text format, so a Prometheus federation endpoint already scraping
# every agent is the way to cover a whole cluster:
#
#   endpoint = "http://prometheus-server.monitoring.svc:9090/federate?match[]={__name__=~\"attributed_energy_.*\"}"
#
# Confirm the federated exposition keeps `metric_name` and `label_key` intact
# before trusting the figures: that depends on your Prometheus relabeling.
#
# Two deliberate differences from the .toml, both forced by the cluster:
#   - `endpoint` uses in-cluster DNS instead of localhost, since it resolves
#     from the perf-sentinel pod rather than from a shared host.
#   - `[green] enabled` and `default_region` are not repeated here. The base
#     values already set them in config.toml, which is merged after this
#     fragment and would win anyway.

config:
  fragments:
    30-green-alumet.toml: |
      [green.alumet]
      # Prometheus /metrics URL of the Alumet exporter. No default, required
      # to activate the scraper.
      endpoint = "http://alumet.observability.svc:9091/metrics"   # no default, required
      scrape_interval_secs = 5   # default 5
      # No defaults, both required. Read them off your own endpoint: the
      # exporter names metrics after a prefix, a suffix and an attribution
      # formula you choose, so this line is a plausible name, not yours.
      #   kubectl -n observability exec deploy/alumet -- \
      #     curl -s localhost:9091/metrics | grep -i energy
      metric_name = "attributed_energy_cpu_alumet"   # no default, required
      label_key = "name"   # no default, required
      # /!\ Must equal the poll_interval of the Alumet source feeding the
      # metric. Alumet publishes the joules of one interval as a gauge, so a
      # mismatch rescales energy and carbon silently.
      energy_interval_secs = 1.0   # default 1.0
      # Map each service name to the label value carrying its energy. Under
      # the k8s plugin that label value is usually the pod name.
      service_mappings = { "account-svc" = "account-pod", "game-svc" = "game-pod" }   # default empty

      # Optional: attribute the database cgroup too, which turns the estimated
      # database waste figure into a measured one.
      # [green.alumet.database]
      # label_value = "postgres-0"   # no default, required in this block

# Credentials, when the exporter sits behind auth. PERF_SENTINEL_ALUMET_AUTH_HEADER
# wins over the optional `auth_header` config field, which is deliberately not
# set above: a fragment renders into a ConfigMap, readable by anyone holding
# `get` on the namespace. Create the Secret first:
#   kubectl -n observability create secret generic perf-sentinel-secrets \
#     --from-literal=PERF_SENTINEL_ALUMET_AUTH_HEADER='Authorization: Bearer ...'
#
# extraEnvFrom:
#   - secretRef:
#       name: perf-sentinel-secrets
