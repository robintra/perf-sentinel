# Measured chassis power from a bare-metal Redfish BMC. Each mapped service
# receives its chassis-level coefficient.
# Kubernetes port of examples/34-green-redfish.toml.
#
# Stack on the base values, never alone:
#   helm install perf-sentinel ../../charts/perf-sentinel \
#     --namespace observability \
#     -f values-perf-sentinel.yaml -f values-green-redfish.yaml
#
# Everything not listed here keeps its default. Full key list, defaults and
# ranges: examples/perf-sentinel.toml, or
# https://perf-sentinel.dev/docs/CONFIGURATION
#
# This is the only backend whose target sits outside the cluster: BMCs live on
# a management network. Two consequences.
#
#   - The chart's NetworkPolicy only covers ingress, so it does not block this.
#     If you run your own egress policy, it needs a rule for the BMC subnet or
#     the scraper silently reports nothing.
#   - Chassis power is per machine, not per service. Two services on one
#     chassis are attributed from the same figure. Prefer Alumet or Kepler when
#     you need per-service resolution and RAPL is readable.
#
# One deliberate difference from the .toml: `[green] enabled` and
# `default_region` are not repeated here. The base values already set them in
# config.toml, which is merged after this fragment and would win anyway. The
# BMC URLs need no in-cluster rewrite, they were already off-host.

config:
  fragments:
    34-green-redfish.toml: |
      [green.redfish]
      # BMCs are slow and rate-limit aggressively, do not push this down to the
      # 5s the in-cluster scrapers use.
      scrape_interval_secs = 60   # default 60, bounds 15..3600
      # Reserved. Setting this currently stops the scraper, so leave it unset.
      # ca_bundle_path = "/etc/ssl/bmc-ca.pem"   # default unset
      # Credentials belong in PERF_SENTINEL_REDFISH_AUTH_HEADER, which wins over
      # this optional field.
      # auth_header = "Authorization: Basic BASE64"   # default unset

      # Default empty. At least one endpoint is required to activate the scraper.
      # Both fields have no default and are required. Use "legacy_power" for /Power
      # or "environment_metrics" for /EnvironmentMetrics. Which one your BMC serves
      # depends on its firmware generation, not on the vendor.
      [green.redfish.endpoints."chassis-legacy-1"]
      url = "https://bmc-rack-01.dc.example/redfish/v1/Chassis/1/Power"
      schema = "legacy_power"

      [green.redfish.endpoints."chassis-modern-1"]
      url = "https://bmc-rack-02.dc.example/redfish/v1/Chassis/1/EnvironmentMetrics"
      schema = "environment_metrics"

      # Default empty. Map each service to an endpoint chassis ID declared above.
      [green.redfish.service_mappings]
      "order-svc" = "chassis-legacy-1"
      "chat-svc" = "chassis-legacy-1"
      "ledger-svc" = "chassis-modern-1"

# BMC credentials. Required in practice, a Redfish endpoint is never open. The
# env var wins over the `auth_header` field above, which is deliberately left
# commented: a fragment renders into a ConfigMap, readable by anyone holding
# `get` on the namespace. Create the Secret first:
#   kubectl -n observability create secret generic perf-sentinel-secrets \
#     --from-literal=PERF_SENTINEL_REDFISH_AUTH_HEADER="Authorization: Basic $(printf 'user:pass' | base64)"
#
# extraEnvFrom:
#   - secretRef:
#       name: perf-sentinel-secrets
