# Measured container or process energy from one Kepler v0.10+ /metrics endpoint.
# Kubernetes port of examples/33-green-kepler.toml.
#
# Stack on the base values, never alone:
#   helm install perf-sentinel ../../charts/perf-sentinel \
#     --namespace observability \
#     -f values-perf-sentinel.yaml -f values-green-kepler.yaml
#
# Everything not listed here keeps its default. Full key list, defaults and
# ranges: examples/perf-sentinel.toml, or
# https://perf-sentinel.dev/docs/CONFIGURATION
#
# Kepler is the most Kubernetes-native of the measured backends: it already
# ships as a DaemonSet and labels its metrics by container. On nodes without
# readable RAPL it falls back to its own estimator, so check which mode yours
# reports before publishing the figures as measurements.
#
# Prerequisites:
#   - Kepler installed, commonly in kube-system, with its /metrics Service.
#   - The exporter reachable from the perf-sentinel pod. A NetworkPolicy that
#     isolates kube-system needs an egress rule for this.
#
# /!\ One endpoint, one node. Kepler is a DaemonSet and the Service below is a
# ClusterIP, so each scrape is load-balanced to one arbitrary pod and returns
# that node's containers only. On a single-node cluster (kind, minikube, a dev
# box) that is the whole cluster and the figures are complete. On a multi-node
# cluster the energy attributed jumps between nodes and under-reports without
# ever failing, which is the worst failure mode a measurement can have.
#
# The scraper reads any endpoint serving Prometheus text format and looks up
# the metric by name and label, so pointing it at a Prometheus federation
# endpoint that already scrapes every Kepler pod is the way to cover a whole
# cluster:
#
#   endpoint = "http://prometheus-server.monitoring.svc:9090/federate?match[]={__name__=~\"kepler_container_.*\"}"
#
# Confirm on your own cluster that the federated exposition keeps the metric
# name and the container_name label intact before trusting the figures: that
# depends on your Prometheus relabeling, not on this chart.
#
# One deliberate difference from the .toml: `[green] enabled` and
# `default_region` are not repeated here. The base values already set them in
# config.toml, which is merged after this fragment and would win anyway. The
# endpoint needs no adjustment, the upstream example is already in-cluster.

config:
  fragments:
    33-green-kepler.toml: |
      [green.kepler]
      # Prometheus /metrics URL. No default, required to activate the scraper.
      endpoint = "http://kepler.kube-system.svc.cluster.local:9102/metrics"   # no default, required
      scrape_interval_secs = 5   # default 5, bounds 1..3600
      # "container" reads container_name. "process" reads the 15-byte Linux comm.
      # Keep "container" on Kubernetes: comm is truncated and shared across pods
      # running the same runtime.
      metric_kind = "container"   # default "container", or "process"
      # Credentials belong in PERF_SENTINEL_KEPLER_AUTH_HEADER, which wins over
      # this optional field.
      # auth_header = "Authorization: Bearer TOKEN"   # default unset

      # Default empty. Map each service to its container_name or comm label.
      # container_name is the container name from the pod spec, not the pod name
      # and not the Deployment name:
      #   kubectl -n kube-system exec ds/kepler -- \
      #     curl -s localhost:9102/metrics | grep container_name
      [green.kepler.service_mappings]
      "order-svc" = "order-svc-deployment"
      "chat-svc" = "chat"

# Credentials, when the exporter sits behind auth. The env var wins over the
# `auth_header` field above, which is deliberately left commented: a fragment
# renders into a ConfigMap, readable by anyone holding `get` on the namespace.
# Create the Secret first:
#   kubectl -n observability create secret generic perf-sentinel-secrets \
#     --from-literal=PERF_SENTINEL_KEPLER_AUTH_HEADER='Authorization: Bearer ...'
#
# extraEnvFrom:
#   - secretRef:
#       name: perf-sentinel-secrets
