# Modelled energy for cloud VMs. Kubernetes port of
# examples/31-green-cloud.toml.
#
# Stack on the base values, never alone:
#   helm install perf-sentinel ../../charts/perf-sentinel \
#     --namespace observability \
#     -f values-perf-sentinel.yaml -f values-green-cloud.yaml
#
# This is the backend for managed node pools, which expose no RAPL and
# therefore cannot be measured by Alumet, Kepler or Scaphandre. It reads CPU
# utilization from a Prometheus you already run (cloudwatch_exporter, GCP
# monitoring, Azure exporter) and applies the embedded SPECpower table. The
# model tag is `cloud_specpower`, one rung below the measured backends: an
# estimate, not a measurement, and the disclosure says so.

config:
  fragments:
    31-green-cloud.toml: |
      [green.cloud]
      # In-cluster DNS, not localhost: this resolves from the perf-sentinel
      # pod. Name the Prometheus that holds your cloud exporter series, which
      # is often not the one scraping perf-sentinel itself.
      prometheus_endpoint = "http://prometheus-server.monitoring.svc:9090"
      scrape_interval_secs = 15
      # Fallbacks for any service not named below.
      #   provider: "aws", "gcp" or "azure". Anything else is rejected at
      #     startup.
      #   instance_type: looked up in the embedded SPECpower table. An unknown
      #     one warns at startup and coarsens to a provider average rather than
      #     failing, and that warning is how you check yours. Full list:
      #     https://github.com/robintra/perf-sentinel/blob/main/docs/INSTANCE-TYPES.md
      default_provider = "aws"
      default_instance_type = "c5.4xlarge"
      # Omit cpu_metric and the query is derived from the provider. Set it only
      # when your exporter names the series differently.
      # cpu_metric = "aws_ec2_cpuutilization_average"

      # Per service, either an instance type from the SPECpower table, or the
      # two watt figures when your hardware is not in it. The second form is
      # exact rather than approximated, use it for on-prem nodes.
      [green.cloud.services]
      "order-svc" = { provider = "aws", instance_type = "m7i.4xlarge" }
      "payment-svc" = { provider = "aws", instance_type = "c5.4xlarge" }
      "chat-svc" = { idle_watts = 45.0, max_watts = 120.0 }

# Credentials, when Prometheus is behind auth. Create the Secret first:
#   kubectl -n observability create secret generic perf-sentinel-secrets \
#     --from-literal=PERF_SENTINEL_CLOUD_AUTH_HEADER='Authorization: Bearer ...'
#
# extraEnvFrom:
#   - secretRef:
#       name: perf-sentinel-secrets
