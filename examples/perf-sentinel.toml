# Reference perf-sentinel config with every section annotated.
#
# This file is the inventory. The numbered GreenOps files beside it are
# composable fragments. Copy the ones you need into `.perf-sentinel.d/`
# without renaming them:
#
#   30-green-alumet.toml               measured energy, bare metal or k8s node
#   31-green-cloud.toml                modelled energy, cloud VMs with no RAPL
#   32-green-scaphandre.toml           measured process energy from Scaphandre
#   33-green-kepler.toml               measured container energy from Kepler
#   34-green-redfish.toml              measured chassis energy from Redfish BMC
#   40-green-electricity-maps.toml     live grid intensity, Electricity Maps
#
# Fragments load by their two-digit priority. Duplicate priorities and names
# outside `NN-lowercase-name.toml` are rejected. This main file loads last and
# overrides fragment values, while nested tables merge recursively.
# `60-daemon-docker.toml` is instead a standalone main config for the Compose
# collector and sharded topologies. Mount it as `.perf-sentinel.toml`, then put
# only optional GreenOps fragments beside it in `.perf-sentinel.d/`.
#
# Copy this file to `.perf-sentinel.toml` in your working directory (or mount
# it into the container, see `examples/docker-compose-collector.yml`) and
# uncomment the sections you need.
#
# Unless a comment says otherwise, the value shown IS the default, the one
# perf-sentinel uses when the file is absent, and you only need to list the
# fields you want to override. Where this file deliberately departs from the
# default, the comment on the line gives the value to restore. The `[daemon]`
# section names its default on every line, plus the accepted range.
#
# Reading order: what is on by default comes first, then the settings marked
# /!\ that expose the daemon or change what it reports, then everything that
# is off until you turn it on (energy scrapers, then carbon, then reporting).
#
# One TOML rule shapes the layout: a bare key belongs to the last table
# declared above it. Keys of `[green]` and `[daemon]` therefore stay inside
# their own block, even the dangerous ones, and only whole sub-tables could
# be moved to the end. Uncommenting a key into the wrong block silently files
# it under the wrong table.
#
# Full reference: `docs/CONFIGURATION.md`, or
# https://perf-sentinel.dev/docs/CONFIGURATION for the same thing online.

# ---------------------------------------------------------------------------
# Quality gate thresholds (used by `analyze --ci` and the daemon quality gate)
# ---------------------------------------------------------------------------
[thresholds]
# Max number of critical N+1 SQL findings tolerated. Any finding above this
# fails the quality gate (non-zero exit code).
n_plus_one_sql_critical_max = 0   # default 0, any positive integer
# Max number of warning-level N+1 HTTP findings tolerated.
n_plus_one_http_warning_max = 3   # default 3, any positive integer
# Max number of warning-level N+1 messaging findings tolerated. Warning+ like
# the HTTP rule rather than critical-only: a client that batches its publishes
# makes the occurrence count an upper bound.
n_plus_one_messaging_warning_max = 3   # default 3, any positive integer
# Max avoidable-I/O waste ratio tolerated (0.0 to 1.0).
io_waste_ratio_max = 0.30   # default 0.30, bounds 0.0..1.0
# Min share of I/O-shaped spans that must be analyzable (SQL spans carrying
# db.statement, HTTP spans carrying a full URL). Guards against a false green
# from unusable instrumentation: below the threshold the gate fails even with
# zero findings. Only applies to OTLP input, which carries the filter tally.
# Commented out by default: absent means the rule is disabled.
# min_usable_span_ratio = 0.9   # disabled by default, bounds 0.0..1.0

# ---------------------------------------------------------------------------
# Detection tuning (applies to all detectors, messaging findings included:
# they reuse the window and occurrence settings below, they have none of
# their own)
# ---------------------------------------------------------------------------
[detection]
# Sliding window for N+1 and redundant detection (ms).
window_duration_ms = 500   # default 500, min 1
# Minimum occurrences of a normalized template within the window to flag N+1.
n_plus_one_min_occurrences = 5   # default 5, min 1
# Slow-query threshold (ms). Spans above this value for a template that
# repeats across traces are reported as `slow_sql` / `slow_http`.
slow_query_threshold_ms = 500   # default 500, min 1
slow_query_min_occurrences = 3   # default 3, min 1
# Max child spans under a single parent before flagging `excessive_fanout`.
max_fanout = 20   # default 20, bounds 1..100000, warns outside 5..1000
# Min distinct targets a service must hit in one trace to be `chatty`.
chatty_service_min_calls = 15   # default 15, min 1
# Min concurrent in-flight SQL queries to flag a `pool_saturation` event.
pool_saturation_concurrent_threshold = 10   # default 10, min 2
# Min sequential calls to the same target to flag `serialized_but_parallelizable`.
serialized_min_sequential = 3   # default 3, min 2
# An OTel sanitizer replaces SQL literals with placeholders, which makes an
# N+1 and a repeated identical query look the same. This picks the recovery
# heuristic: "auto", "strict", "always", "never". What each does, and the
# ORM instrumentation scopes it recognizes:
#   https://perf-sentinel.dev/docs/CONFIGURATION#sanitizer_aware_classification
#
# Which one to run: "strict" when a `redundant_sql` finding is itself
# actionable for you, such as a polling loop or an unmemoized lookup served
# from cache, since "auto" reclassifies those on the ORM scope alone. This is
# what the simulation lab runs on all 14 of its stacks. Stay on "auto" when
# you would rather over-report than miss one.
#
# Note the ceiling either way: past 3x `n_plus_one_min_occurrences` in one
# trace (15 by default), a sanitized group is reported as N+1 under "strict"
# too, whatever the timing and whatever the scope. "strict" changes the
# verdict on moderate counts, not on the large ones.
sanitizer_aware_classification = "auto"   # default "auto"

# Attributes that separate one deployment from another, most specific first.
# The first one present on a span decides which findings are the "same"
# problem: two identical N+1 in two namespaces stay two findings instead of
# folding into one. Any resource or span attribute works, so a shared cluster
# can group by tenant where the namespace does not tell tenants apart.
# The others are still captured and displayed, never dropped.
#
# Acknowledgment signatures ignore this entirely, so one ack still covers
# every deployment and changing this list never invalidates an ack.
# Max 8 entries, each captured per span. An empty list turns grouping off.
grouping_attributes = ["k8s.namespace.name", "service.namespace"]

# ---------------------------------------------------------------------------
# GreenOps / carbon scoring
#
# On by default with the embedded reference data, no network access. The
# measured-energy scrapers and the live carbon API are all opt-in and live at
# the end of this file.
# ---------------------------------------------------------------------------
[green]
# Master toggle. When `false`, no `co2` / `regions` fields are emitted and
# all Scaphandre / Cloud / Electricity Maps scrapers are disabled.
enabled = true   # default true

# Region used when an event has no `cloud.region` attribute and the service
# is not listed in `[green.service_regions]`. Must be a valid region ID
# (e.g. `eu-west-3`, `us-east-1`, `asia-southeast1`). See
# https://perf-sentinel.dev/docs/CONFIGURATION for the embedded region table.
default_region = "eu-west-3"       # default: none, and then a service with no
#                                  # cloud.region attribute gets no carbon figure at all

# SCI v1.0 embodied carbon term `M = traces × embodied_per_request_gco2`,
# region-independent. Default `0.001` g/req covers typical commodity hardware
# amortization. Raise for GPU-heavy workloads.
embodied_carbon_per_request_gco2 = 0.001   # default 0.001, 0.0 deprecated

# Per-operation energy coefficients. Leave `true` unless you have specific
# reasons to treat all I/O as equal.
per_operation_coefficients = true   # default true

# Hourly intensity profiles for 30+ regions (24 UTC values, monthly × hourly
# where available). When `true`, the model tag becomes `io_proxy_v2`.
use_hourly_profiles = true   # default true

# The network-transport term has no keys here on purpose. It is always
# computed, displayed and disclosed, with a fixed 0.04 kWh/GB coefficient
# and a published 0.001-0.059 kWh/GB bracket, so every disclosure scales
# it identically. It needs `response_size_bytes` on your spans and counts
# nothing without it. The pre-0.9.25 keys `include_network_transport` and
# `network_energy_per_byte_kwh` still parse, with a warning, and do nothing.

# User-supplied hourly profile file (CSV or JSON). Overrides the embedded
# table for the listed regions. Useful when you have a PPA or private grid
# mix. Values are validated to be within ±5% of the embedded annual mean.
# hourly_profiles_file = "/etc/perf-sentinel/hourly-profiles.json"   # default unset (embedded table only)

# Calibration file produced by `perf-sentinel calibrate`. Tunes the I/O -> energy
# coefficient from RAPL measurements on your real infra. The model tag gets
# a `+cal` suffix (e.g. `io_proxy_v2+cal`) when active.
# calibration_file = "/etc/perf-sentinel/calibration.toml"   # default unset (no calibration)

# ===========================================================================
# Daemon configuration (only applies to `perf-sentinel watch`)
#
# Every key the daemon accepts is listed below with its default, so this
# section doubles as the checklist. An unknown key under [daemon] is ignored
# in silence, so a typo reads as a code bug rather than a config mistake:
# copy names from here rather than from memory.
#
# Full reference, with the per-key tables:
#   https://perf-sentinel.dev/docs/CONFIGURATION  (or `docs/CONFIGURATION.md`)
# ===========================================================================
[daemon]
# Bind address. /!\ `0.0.0.0` exposes ingestion and the query API to
# everything that can route to this host, use it only inside a container
# whose isolation is handled upstream.
listen_address = "127.0.0.1"       # default 127.0.0.1
# OTLP HTTP port, also serves `/metrics` and the query API.
listen_port_http = 4318            # default 4318
listen_port_grpc = 4317            # default 4317
# Unix socket for the native JSON ingestion path.
json_socket = "/tmp/perf-sentinel.sock"   # default /tmp/perf-sentinel.sock
# Traces open at once. Memory grows about linearly with it.
max_active_traces = 10000          # default 10000, warns outside 1000..100000
# How long a trace waits for late spans, in MILLISECONDS.
trace_ttl_ms = 30000               # default 30000, bounds 100..3600000
# I/O spans kept per trace. SERVER-root contexts and span-ancestry entries
# (parent link plus optional endpoint) each have the same separate cap.
max_events_per_trace = 1000        # default 1000, bounds 1..100000
# Max single OTLP request, in bytes. Large because an exporter flushing its
# queue when the process exits sends one big batch.
max_payload_size = 16777216        # default 16777216 (16 MiB), bounds 1024..104857600
# Findings kept in memory for `/api/findings`. 0 disables the store and the
# ack routes that read it.
max_retained_findings = 10000      # default 10000, bounds 0..10000000
# Findings carried by one /api/export/report snapshot. The store keeps far
# more, this only sizes the export. The exported quality gate counts only this
# slice, so at 0 it ships the envelope alone and its three finding-count
# rules pass whatever the daemon detected. The fourth, io_waste_ratio_max,
# reads green_summary, which no cap empties, so the verdict still moves.
max_export_findings = 1000         # default 1000, bounds 0..100000
# Traces whose masked spans are kept so `/api/export/report` still carries a
# span tree. Costs memory in proportion to max_events_per_trace, hence the
# much smaller cap. 0 keeps none: the exported report then has findings only.
max_retained_traces = 50           # default 50, bounds 0..10000
# Bounded queues. Raise under bursty load to cut backpressure and shedding.
ingest_queue_capacity = 1024       # default 1024, bounds 1..1048576
analysis_queue_capacity = 1024     # default 1024, bounds 1..1048576
# `service` label on findings and slow-span histograms (bounded by the
# daemon's cardinality caps). false restores the pre-0.18 label shape.
per_service_labels = true          # default true

# Stamped on every finding as `confidence`, read by downstream tooling and
# not by the quality gate. Two values here, case-insensitive, anything else
# is rejected at load time: "production" -> `daemon_production` (real
# patterns at real scale), "staging" -> `daemon_staging` (real patterns, not
# production scale). The other two confidence levels belong to batch runs
# and are not settable: `ci_batch` when `analyze` detects a CI environment,
# `local_batch` otherwise. Set this to match the environment, the value
# shown is for the production daemon this file describes.
environment = "production"         # default "staging"
# Serve the query API (`/api/*`). `false` keeps OTLP ingestion and
# `/metrics`, drops every read and ack route including the dashboard's
# live mode.
api_enabled = true                 # default true

# -------------------------------------------------------------------------- #
#        /!\ Change these only if you know what you are doing /!\            #
# -------------------------------------------------------------------------- #
# Still inside [daemon], because a bare key cannot be moved past a
# sub-table. These change what the daemon reports, or what it exposes, not
# how fast it runs. A wrong value here does not fail, it produces a daemon
# that answers confidently with less than the truth, or one reachable by
# more than you meant.
#
# Below 1.0 every count describes a sample of the traffic rather than a
# measure of it, a rare pattern can be missed entirely, and nothing
# downstream can tell the two apart. Collector-side tail sampling in front
# of the daemon does the same and cannot even be detected: prefer a second
# collector pipeline exporting here unsampled.
sampling_rate = 1.0                # default 1.0, bounds 0.0..1.0
#
# cgroup v2 admission control: past that share of the container memory
# limit, ingestion is refused before decoding rather than letting the pod
# get OOMKilled. Needs a container memory limit to mean anything. 1..5 are
# rejected, the 5-point hysteresis low bound would be unreachable.
memory_high_water_pct = 0          # default 0 (guard off), else 6..100
#
# TLS for both listeners. Both fields together or both absent. The daemon
# warns when the key file is readable by group or others.
# tls_cert_path = "/etc/tls/server-cert.pem"   # default unset (plain TCP)
# tls_key_path = "/etc/tls/server-key.pem"     # default unset (plain TCP)

# --- Cross-service correlation ---------------------------------------------
# Daemon-only output, batch `analyze` never produces it. Single-process, so
# it only sees what this daemon buffers: run it on one instance receiving
# every service you want correlated. Enabled here, off in the code default,
# and the cost is the pair table below.
[daemon.correlation]
enabled = true             # default false
window_minutes = 10        # default 10, in MINUTES here
lag_threshold_ms = 5000    # default 5000, max lag between two events
min_co_occurrences = 5     # default 5, pairs seen fewer times are dropped
min_confidence = 0.7       # default 0.7, below this a pair is not reported
# Pairs are keyed by (finding type, service, template, grouping), so the
# count grows with the topology, not with traffic: a handful of services
# overruns this default. Past the cap the correlator recycles pairs and
# /api/correlations returns an arbitrary subset, with no marker on the
# output. perf_sentinel_correlator_pairs_evicted_total is the signal, and
# the daemon logs a warning the first time it evicts.
max_tracked_pairs = 10000  # default 10000, memory ceiling for the table

# --- What your deployment topology changes ---------------------------------
# The keys above are the same everywhere the binary runs. What differs is
# whether some of them can work at all. Details:
#   https://perf-sentinel.dev/docs/HELM-DEPLOYMENT  ("Workload modes")
#
# Single process, container or Deployment (recommended): everything above
#   applies. The trace window is in memory and per process, so scale
#   vertically first.
#
# StatefulSet with persistence: the only topology where `[daemon.ack]`
#   storage and `[daemon.archive]` survive a restart, and therefore the only
#   one where runtime acks work. On a Deployment or a DaemonSet the store
#   path cannot even be resolved (scratch image, no HOME), the daemon logs a
#   WARN at startup and the two ack write routes answer 503. Note that the
#   Helm chart writes both paths itself unless you set
#   `persistence.manageDaemonPaths: false`, and refuses to render if you
#   declare them anyway.
#
# DaemonSet: one daemon per node splits the spans of a trace across pods
#   unless an upstream collector routes by trace ID (OTel `loadbalancing`
#   exporter, `routing_key: traceID`). Without it, N+1 groups fall under
#   their threshold and the findings simply never appear, with no error and
#   no metric that moves. `max_active_traces` and the queue capacities are
#   then per pod, and `[daemon.correlation]` only ever sees one node's
#   share of the traffic.

# ###########################################################################
#                        /!\ EXPOSURE SETTINGS /!\
#
# Everything below this line either opens a door or authenticates one. Read
# before uncommenting, they are off in the shipped defaults.
# ###########################################################################

# --- /!\ Runtime acknowledgments (daemon-side, JSONL) /!\ ------------------
# Distinct from the CI baseline `.perf-sentinel-acknowledgments.toml`, which
# stays read-only at runtime. `docs/ACK-WORKFLOW.md` says which belongs
# where. Needs a durable path, see the topology block above.
# /!\ These routes are on by default and unauthenticated until `api_key` is
# set: any client that reaches the port can acknowledge or revoke a finding,
# which is harmless on 127.0.0.1 and is not on 0.0.0.0. Set the key whenever
# the port is reachable by anything but this host.
# [daemon.ack]
# enabled = true                                   # default true, 503 without a writable store
# storage_path = "/var/lib/perf-sentinel/acks.jsonl"  # default: OS data dir, unresolvable on scratch images
# api_key = "a-long-random-string"                 # default unset (NO AUTH), 12 chars min, 16 recommended
#                                                  # PERF_SENTINEL_ACK_API_KEY wins over this line, and is
#                                                  # how you keep the secret out of the file. There is no
#                                                  # "env:VAR" indirection, such a value is taken literally
# toml_path = ".perf-sentinel-acknowledgments.toml"   # default .perf-sentinel-acknowledgments.toml

# --- /!\ Batched export to PerfSentinelHub /!\ ----------------------------
# Coalesces repeated signatures and never blocks detection. Mount the API
# key as a Secret-backed file; never put its value in this TOML file.
# [daemon.hub_export]
# enabled = true
# endpoint = "https://hub.example.com/api/import/findings"
# source_id = "production-a"
# api_key_file = "/run/secrets/perf-sentinel-hub-api-key"
# batch_size = 100                 # default 100, bounds 1..100
# flush_interval_secs = 5          # default 5, bounds 1..300
# max_pending = 10000              # default 10000, bounds 1..1000000

# --- /!\ Browser access to the query API ------------------------------------
# Empty means no browser origin can read the API, which is the safe state.
# Full origins (scheme + host + optional port, no trailing slash). "*" is
# wildcard mode and mixes neither with an explicit origin nor with
# `[daemon.ack] api_key`: that key travels on every cross-origin request, so
# any origin could then use it.
# [daemon.cors]
# allowed_origins = ["https://dashboards.example.com"]  # default [] (no browser origin)

# ###########################################################################
# OFF UNTIL YOU TURN THEM ON
#
# Measured energy first, most direct measurement first, then carbon, then
# reporting. None of them reaches the network until you fill in an endpoint.
# Every scraper credential also reads from an environment variable, which is
# what the daemon prefers and warns about when it finds the value here
# instead: PERF_SENTINEL_{REDFISH,ALUMET,KEPLER,SCAPHANDRE,CLOUD}_AUTH_HEADER
# and PERF_SENTINEL_EMAPS_TOKEN.
# Which one applies to your hardware:
#   https://perf-sentinel.dev/docs/ENERGY
# ###########################################################################

# --- Redfish BMC wall-plug power scraper (opt-in, no default egress) -------
# Bare-metal nodes with a BMC supporting Redfish 1.0+ (Dell iDRAC, HPE iLO,
# Lenovo XCC, Supermicro X11+, OpenBMC). Reads PowerConsumedWatts from the
# chassis Power resource and distributes the joules across mapped services
# proportional to their ops. Every service mapped to the same chassis
# receives the same node-level coefficient. Model tag: `redfish_bmc`.
#
# This release does NOT yet support self-signed BMC certificates. Front the
# BMC with a reverse proxy presenting a publicly-signed cert if needed.
# /!\ `ca_bundle_path` is parsed but reserved: setting it makes the scraper
# log an error and stop before its first poll, with the daemon otherwise
# healthy, so leave it out until the follow-up lands.
#
# [green.redfish]
# scrape_interval_secs = 60                      # default 60
# ca_bundle_path = "/etc/ssl/bmc-ca.pem"         # RESERVED, do not set: the scraper stops on it
# auth_header = "Authorization: Basic BASE64"    # default unset, prefer PERF_SENTINEL_REDFISH_AUTH_HEADER
# Each entry is a table, never a bare URL string. `schema` picks the wire
# shape and therefore the field the parser reads: "legacy_power" for
# /Chassis/{id}/Power, "environment_metrics" for the modern resource. Both
# in docs/CONFIGURATION.md, "Which schema to choose".
# [green.redfish.endpoints]
# "chassis-1" = { url = "https://bmc-rack-01.dc.example/redfish/v1/Chassis/1/Power", schema = "legacy_power" }
# [green.redfish.service_mappings]
# "account-svc" = "chassis-1"

# --- Alumet energy scraper (opt-in, no default egress) ---------------------
# Scrapes the /metrics endpoint of Alumet's prometheus-exporter plugin.
# Model tag `alumet_rapl`, the TOP of the measured-energy precedence chain
# (it outranks `scaphandre_rapl`: same RAPL source, less error-prone
# sampling, per-cgroup rather than per-process attribution).
#
# `metric_name` and `label_key` have NO default and are required: read them
# off your own endpoint, the exporter names them after a prefix/suffix and
# an attribution formula you choose:
#   curl -s http://localhost:9091/metrics | grep -i energy
#
# `energy_interval_secs` MUST match the poll_interval of the Alumet source
# feeding the metric. A mismatch rescales energy and carbon silently. Why,
# and the matching alumet-config.toml:
#   https://perf-sentinel.dev/docs/CONFIGURATION#green-alumet-optional-opt-in
#
# [green.alumet]
# endpoint = "http://localhost:9091/metrics"   # no default, required
# scrape_interval_secs = 5              # default 5
# metric_name = "attributed_energy_cpu_alumet"   # no default, required
# label_key = "name"                    # no default, required
# energy_interval_secs = 1.0            # default 1.0, MUST match the Alumet source poll interval
# service_mappings = { "account-svc" = "account-pod", "game-svc" = "game-pod" }   # default empty
# auth_header = "Authorization: Bearer TOKEN"    # default unset, prefer PERF_SENTINEL_ALUMET_AUTH_HEADER
#
# Attribute the database cgroup, which turns the estimated database waste
# figure into a measured one. `label_value` is the series label of that
# cgroup on your endpoint.
# [green.alumet.database]
# label_value = "postgres-pod"   # no default
# region = "eu-west-3"           # default: the service region
#
# Same for the message broker, feeding messaging waste.
# [green.alumet.broker]
# label_value = "kafka-pod"      # no default
# region = "eu-west-3"           # default: the service region

# --- Kepler eBPF energy scraper (opt-in, no default egress) ----------------
# Works on ARM64 (Graviton, Ampere, Apple Silicon, Cobalt 100) where
# Scaphandre is unavailable. Reads Kepler's cumulative joule counter and
# computes per-container deltas vs the previous scrape window. Model tag:
# `kepler_ebpf` (sits between `scaphandre_rapl` and `cloud_specpower` in
# the precedence chain).
#
# Prerequisites: Kepler installed and exposing /metrics. The current scraper
# performs a direct GET, so the endpoint must return Kepler series themselves.
# A Prometheus server's own /metrics endpoint returns only its internal metrics.
#
# [green.kepler]
# endpoint = "http://kepler.kube-system.svc.cluster.local:9102/metrics"   # no default, required
# scrape_interval_secs = 5              # default 5
# metric_kind = "container"             # default "container", or "process" (Kepler v2 series)
# service_mappings = { "account-svc" = "account-deployment", "game-svc" = "game" }   # default empty
# auth_header = "Authorization: Bearer TOKEN"    # default unset, prefer PERF_SENTINEL_KEPLER_AUTH_HEADER

# --- Scaphandre per-process scraper (opt-in, no default egress) ------------
# For new deployments prefer [green.alumet] above: same RAPL source, less
# error-prone sampling, per-cgroup attribution. Kept for existing setups.
# Scrapes Scaphandre's Prometheus endpoint to get per-process power draw and
# compute `energy_per_op_kwh = (watts × interval) / ops / 3_600_000`. Model
# tag flips to `scaphandre_rapl` when active.
#
# Prerequisites: Scaphandre running and exposing a Prometheus endpoint with
# per-process metrics (`scaph_process_power_consumption_microwatts{exe=...}`).
# Requires RAPL access, so only works on bare-metal / OVH / Hetzner / Scaleway,
# not on AWS/GCP/Azure VMs (use `[green.cloud]` for those).
#
# [green.scaphandre]
# endpoint = "http://localhost:8080/metrics"   # no default, required
# scrape_interval_secs = 5                       # default 5
# auth_header = "Authorization: Bearer TOKEN"    # default unset, prefer PERF_SENTINEL_SCAPHANDRE_AUTH_HEADER
#
# One entry per service, matched against Scaphandre's own process labels.
# `exe_contains` is required, `cmdline_contains` narrows it when several
# services share a runtime binary, which is the usual case on the JVM.
# [green.scaphandre.process_map."account-svc"]
# exe_contains = "bin/java"                     # no default, required
# cmdline_contains = "account-svc.jar"           # default unset
# [green.scaphandre.process_map."chat-svc"]
# exe_contains = "dotnet"                       # no default, required

# --- Cloud CPU% + SPECpower (opt-in, no default egress) --------------------
# Modelled, not measured: for AWS/GCP/Azure VMs that expose no RAPL. Scrapes
# CPU utilization from your existing Prometheus (cloudwatch_exporter, gcp
# monitoring, azure exporter) and applies the SPECpower model.
# Model tag: `cloud_specpower`.
#
# [green.cloud]
# prometheus_endpoint = "http://prometheus:9090"   # no default, required
# scrape_interval_secs = 30             # default 15
# default_provider = "aws"              # default unset, used when a service omits it
# default_instance_type = "c5.4xlarge"  # default unset, same
# cpu_metric = "aws_ec2_cpuutilization_average"  # default unset
# auth_header = "Authorization: Bearer TOKEN"    # default unset, prefer PERF_SENTINEL_CLOUD_AUTH_HEADER
#
# Per service, either an instance type read from the embedded SPECpower
# table, or the two watt figures when your hardware is not in it.
# `cpu_query` overrides `cpu_metric` for one service.
# [green.cloud.services]
# "api-us" = { provider = "aws", instance_type = "c5.4xlarge" }
# "api-asia" = { provider = "gcp", instance_type = "n2-standard-8" }
# "analytics" = { provider = "azure", instance_type = "Standard_D8s_v3" }
# "custom" = { idle_watts = 45.0, max_watts = 120.0 }
# "special" = { provider = "aws", instance_type = "c5.4xlarge", cpu_query = "avg(node_cpu{job=\"special\"})" }

# --- Declared broker cluster (opt-in, no agent needed) ---------------------
# Messaging energy for a managed broker you cannot instrument. Declared, not
# measured: the disclosure schema keeps it in its own provenance bucket so it
# is never published as a measurement. Prefer [green.alumet.broker] when an
# agent can reach the broker cgroup.
# [green.broker_static]
# nodes = 3                      # no default, cluster size
# instance_type = "m5.large"     # no default, looked up in the SPECpower table
# provider = "aws"               # no default
# region = "eu-west-3"           # default: the service region

# --- Carbon: per-service regions -------------------------------------------
# Region override when the OTel `cloud.region` resource attribute is absent.
# Falls back to `[green] default_region`. Values are case-insensitive,
# lowercased at load time.
# [green.service_regions]
# "order-svc" = "us-east-1"
# "chat-svc"  = "ap-southeast-1"

# --- Carbon: Electricity Maps API (opt-in, requires API key) ---------------
# Real-time per-region carbon intensity instead of the embedded hourly profile.
# Falls back to the embedded profile on any scrape failure. Model tag becomes
# `electricity_maps_api` for regions with a fresh sample.
#
# Set the key through PERF_SENTINEL_EMAPS_TOKEN rather than here, it takes
# precedence over this file. There is no "env:VAR" indirection, a value in
# that shape is used literally.
#
# [green.electricity_maps]
# api_key = "your-api-key"                         # no default, required, prefer PERF_SENTINEL_EMAPS_TOKEN
# endpoint = "https://api.electricitymaps.com/v4"  # default https://api.electricitymaps.com/v4
# poll_interval_secs = 3600                        # default 300, bounds 60..86400. The free tier is about 30 requests
#                                                  # per zone per month, so it needs 3600 or more
# region_map = { "eu-west-3" = "FR", "us-east-1" = "US-MIDA-PJM", "eu-central-1" = "DE" }   # no default, at least one entry required
# emission_factor_type = "lifecycle"               # default "lifecycle", or "direct" (combustion only)
# temporal_granularity = "hourly"                  # default "hourly", or "5_minutes" / "15_minutes"

# --- Per-window NDJSON archive (input for `disclose`) ----------------------
# Written only when `path` is set. Requires `[green] enabled = true`, the
# daemon refuses the pairing otherwise since an archive of windows with no
# energy would make `disclose` output meaningless. Needs a durable path, see
# the topology block above.
#
# Each window is hash-chained to the one before it, and `disclose` reports
# how many verified and how many breaks it found. That detects a window
# edited or removed after the fact, and does not attest the source: whoever
# controls this daemon and these files can regenerate a consistent chain.
# [daemon.archive]
# path = "/var/lib/perf-sentinel/archive.ndjson"   # default unset (no archive)
# max_size_mb = 100   # default 100, rotate past this size, >= 1
# max_files = 12      # default 12, rotated files kept, >= 1

# --- Public disclosure reporting -------------------------------------------
# Read this before filling anything in: `disclose` takes its own values from
# CLI flags (`--intent`, `--confidentiality`, `--period-type`, `--org-config`,
# `--output`), NOT from this section. What is left here only gates the daemon
# at startup. What each intent commits you to:
#   https://perf-sentinel.dev/docs/REPORTING
# [reporting]
# intent = "internal"                   # default unset. "internal", "official" or "audited"
#                                       # /!\ read by the daemon at startup only: "audited" makes
#                                       # it REFUSE to start (not implemented yet), and "official"
#                                       # requires org_config_path and validates that file
# org_config_path = "/etc/perf-sentinel/org.toml"      # default unset, required when intent = "official"
# confidentiality_level = "internal"    # default unset, "internal" or "public". RESERVED: validated
#                                       # then unused, the published value comes from
#                                       # `disclose --confidentiality`
# disclose_output_path = "/var/lib/perf-sentinel/disclosure.json"   # default unset, RESERVED: no
#                                       # effect today, reports come from `disclose --output`
# disclose_period = "calendar-quarter"  # default unset, "calendar-month" / "calendar-year" /
#                                       # "custom". RESERVED: unused, see `disclose --period-type`

# Sigstore endpoints, Rekor being the transparency log and Fulcio the
# certificate authority. /!\ RESERVED, both are parsed and then unused:
# `verify-hash` shells out to `cosign verify-blob`, which is never given
# `--rekor-url` or `--fulcio-url`, so it follows its own configuration.
# Pointing these at a private Sigstore instance changes nothing today.
# [reporting.sigstore]
# rekor_url = "https://rekor.sigstore.dev"     # default https://rekor.sigstore.dev, no effect
# fulcio_url = "https://fulcio.sigstore.dev"   # default https://fulcio.sigstore.dev, no effect
