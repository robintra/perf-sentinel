# Reference perf-sentinel config with every section annotated.
#
# Copy this file to `.perf-sentinel.toml` in your working directory (or mount
# it into the container, see `examples/docker-compose-collector.yml`) and
# uncomment the sections you need.
#
# Unless a comment says otherwise, the value shown IS the default, the one
# perf-sentinel uses when the file is absent, and you only need to list the
# fields you want to override. Where this file deliberately departs from the
# default, the comment on the line gives the value to restore. The `[daemon]`
# section names its default on every line, plus the accepted range.
#
# Full reference: `docs/CONFIGURATION.md`, or
# https://perf-sentinel.dev/docs/CONFIGURATION for the same thing online.

# ---------------------------------------------------------------------------
# Quality gate thresholds (used by `analyze --ci` and the daemon quality gate)
# ---------------------------------------------------------------------------
[thresholds]
# Max number of critical N+1 SQL findings tolerated. Any finding above this
# fails the quality gate (non-zero exit code).
n_plus_one_sql_critical_max = 0
# Max number of warning-level N+1 HTTP findings tolerated.
n_plus_one_http_warning_max = 3
# Max number of warning-level N+1 messaging findings tolerated. Warning+ like
# the HTTP rule rather than critical-only: a client that batches its publishes
# makes the occurrence count an upper bound.
n_plus_one_messaging_warning_max = 3
# Max avoidable-I/O waste ratio tolerated (0.0 to 1.0).
io_waste_ratio_max = 0.30

# ---------------------------------------------------------------------------
# Detection tuning (applies to all detectors)
# ---------------------------------------------------------------------------
[detection]
# Sliding window for N+1 and redundant detection (ms).
window_duration_ms = 500
# Minimum occurrences of a normalized template within the window to flag N+1.
n_plus_one_min_occurrences = 5
# Slow-query threshold (ms). Spans above this value for a template that
# repeats across traces are reported as `slow_sql` / `slow_http`.
slow_query_threshold_ms = 500
slow_query_min_occurrences = 3
# Max child spans under a single parent before flagging `excessive_fanout`.
max_fanout = 20
# Min distinct targets a service must hit in one trace to be `chatty`.
chatty_service_min_calls = 15
# Min concurrent in-flight SQL queries to flag a `pool_saturation` event.
pool_saturation_concurrent_threshold = 10
# Min sequential calls to the same target to flag `serialized_but_parallelizable`.
serialized_min_sequential = 3
# How to classify SQL an OTel sanitizer already turned into `?` placeholders,
# where N+1 and redundant-query look identical on the wire:
#   "auto"   reclassify on the ORM scope signal OR timing variance (default)
#   "strict" needs a primary and a corroborating signal, fewer false N+1
#   "always" reclassify any sanitized group at the threshold, most aggressive
#   "never"  no heuristic, a sanitized N+1 is reported as `redundant_sql`
#
# What to pick depends on whether your instrumentation names an ORM, which
# is the strongest signal. Recognized scopes: spring-data, hibernate, jpa,
# micronaut-data, jdbi, r2dbc (JVM), entityframeworkcore (.NET), sqlalchemy,
# django (Python), activerecord (Ruby), gorm (Go), sequelize, prisma,
# typeorm, mongoose (Node.js), sea-orm, diesel (Rust), laravel, doctrine
# (PHP).
#   ORM from that list  -> "auto". Switch to "strict" only if you get N+1
#                          findings you consider false.
#   bare driver, no ORM -> "auto" as well, and do NOT use "strict": with no
#                          scope to corroborate, it falls back to
#                          `redundant_sql` on the lower occurrence counts.
#                          Covers plain JDBC, sqlx, jmoiron/sqlx, psycopg,
#                          node-postgres, PDO without Doctrine.
# "never" only when you want the strict distinct-params semantics and accept
# losing sanitized N+1 entirely.
sanitizer_aware_classification = "auto"   # default "auto"

# ---------------------------------------------------------------------------
# GreenOps / carbon scoring
# ---------------------------------------------------------------------------
[green]
# Master toggle. When `false`, no `co2` / `regions` fields are emitted and
# all Scaphandre / Cloud / Electricity Maps scrapers are disabled.
enabled = true

# Region used when an event has no `cloud.region` attribute and the service
# is not listed in `[green.service_regions]`. Must be a valid region ID
# (e.g. `eu-west-3`, `us-east-1`, `asia-southeast1`). See `docs/CONFIGURATION.md`
# for the embedded region table.
default_region = "eu-west-3"

# SCI v1.0 embodied carbon term `M = traces × embodied_per_request_gco2`,
# region-independent. Default `0.001` g/req covers typical commodity hardware
# amortization. Raise for GPU-heavy workloads.
embodied_carbon_per_request_gco2 = 0.001

# Per-operation energy coefficients: SELECT 0.5x, INSERT/UPDATE 1.5x, etc.
# Sources: Xu VLDB 2010, Tsirogiannis SIGMOD 2010, DBJoules 2023, IDEAS 2025.
# Leave `true` unless you have specific reasons to treat all I/O as equal.
per_operation_coefficients = true

# Hourly intensity profiles for 30+ regions (24 UTC values, monthly × hourly
# where available). When `true`, the model tag becomes `io_proxy_v2`.
use_hourly_profiles = true

# Include network-transport energy (Mytton et al. 2024, 0.04 kWh/GB default).
# Adds a `sci_v1_numerator+transport` methodology tag. Opt-in because it
# requires the `response_size_bytes` field in your spans.
include_network_transport = false
# network_energy_per_byte_kwh = 0.00000000004 # 0.04 kWh / GB, default

# Per-service region override when the OTel `cloud.region` resource attribute
# is absent. Values are case-insensitive, lowercased at load time.
# [green.service_regions]
# "order-svc" = "us-east-1"
# "chat-svc"  = "ap-southeast-1"

# User-supplied hourly profile file (CSV or JSON). Overrides the embedded
# table for the listed regions. Useful when you have a PPA or private grid
# mix. Values are validated to be within ±5% of the embedded annual mean.
# hourly_profiles_file = "/etc/perf-sentinel/hourly-profiles.json"

# Calibration file produced by `perf-sentinel calibrate`. Tunes the I/O→energy
# coefficient from RAPL measurements on your real infra. The model tag gets
# a `+cal` suffix (e.g. `io_proxy_v2+cal`) when active.
# calibration_file = "/etc/perf-sentinel/calibration.toml"

# --- Alumet energy scraper (opt-in, no default egress) ---------------------
# Scrapes the /metrics endpoint of Alumet's prometheus-exporter plugin.
# Model tag `alumet_rapl`, the TOP of the measured-energy precedence chain
# (it outranks `scaphandre_rapl`: same RAPL source, less error-prone
# sampling, per-cgroup rather than per-process attribution).
#
# `metric_name` and `label_key` have NO default and are required: Alumet's
# exporter shapes every name with a configurable prefix/suffix (default
# suffix `_alumet`), and the per-service series is named after an
# energy-attribution formula you choose. Read them off your own endpoint:
#   curl -s http://localhost:9091/metrics | grep -i energy
#
# `energy_interval_secs` MUST match the poll_interval of the Alumet source
# feeding the metric (upstream default 1s). Alumet publishes the joules of
# one poll interval as a gauge, so perf-sentinel divides by this value to
# recover watts. A mismatch rescales energy and carbon silently. See
# docs/LIMITATIONS.md#alumet-precision-bounds.
#
# Prerequisites: an Alumet agent with `rapl` + `k8s` + `energy-attribution`
# + `prometheus-exporter` for per-service attribution (`rapl` alone only
# measures the whole machine). See docs/CONFIGURATION.md for the matching
# alumet-config.toml.
#
# [green.alumet]
# endpoint = "http://localhost:9091/metrics"
# scrape_interval_secs = 5              # default 5
# metric_name = "attributed_energy_cpu_alumet"   # no default, required
# label_key = "name"                    # no default, required
# energy_interval_secs = 1.0            # default 1.0, MUST match the Alumet source poll interval
# service_mappings = { "account-svc" = "account-pod", "game-svc" = "game-pod" }
# auth_header = "Authorization: Bearer TOKEN"    # default unset, "Name: Value" form
#
# Attribute the database cgroup, which turns the estimated database waste
# figure into a measured one. `label_value` is the series label of that
# cgroup on your endpoint.
# [green.alumet.database]
# label_value = "postgres-pod"   # no default
# region = "eu-west-3"           # default: the service region
#
# Same for the message broker, feeding messaging waste.
# [green.alumet.broker]
# label_value = "kafka-pod"      # no default
# region = "eu-west-3"           # default: the service region

# --- Scaphandre per-process scraper (opt-in, no default egress) ------------
# For new deployments prefer [green.alumet] above: same RAPL source, less
# error-prone sampling, per-cgroup attribution. Kept for existing setups.
# Scrapes Scaphandre's Prometheus endpoint to get per-process power draw and
# compute `energy_per_op_kwh = (watts × interval) / ops / 3_600_000`. Model
# tag flips to `scaphandre_rapl` when active.
#
# Prerequisites: Scaphandre running and exposing a Prometheus endpoint with
# per-process metrics (`scaph_process_power_consumption_microwatts{exe=...}`).
# Requires RAPL access, so only works on bare-metal / OVH / Hetzner / Scaleway,
# not on AWS/GCP/Azure VMs (use `[green.cloud]` for those).
#
# [green.scaphandre]
# endpoint = "http://localhost:8080/metrics"
# scrape_interval_secs = 5              # default 5
# process_map = { "account-svc" = "java", "game-svc" = "game", "chat-svc" = "dotnet" }
# auth_header = "Authorization: Bearer TOKEN"    # default unset, "Name: Value" form

# --- Kepler eBPF energy scraper (opt-in, no default egress) ----------------
# Works on ARM64 (Graviton, Ampere, Apple Silicon, Cobalt 100) where
# Scaphandre is unavailable. Reads Kepler's cumulative joule counter and
# computes per-container deltas vs the previous scrape window. Model tag:
# `kepler_ebpf` (sits between `scaphandre_rapl` and `cloud_specpower` in
# the precedence chain).
#
# Prerequisites: Kepler installed and exposing /metrics. In Kubernetes,
# point at an upstream Prometheus that scrapes the Kepler DaemonSet rather
# than a single pod.
#
# [green.kepler]
# endpoint = "http://kepler.kube-system.svc.cluster.local:9102/metrics"
# scrape_interval_secs = 5              # default 5
# metric_kind = "container"             # default "container", or "process" (Kepler v2 series)
# service_mappings = { "account-svc" = "account-deployment", "game-svc" = "game" }
# auth_header = "Authorization: Bearer TOKEN"    # default unset, "Name: Value" form

# --- Redfish BMC wall-plug power scraper (opt-in, no default egress) -------
# Bare-metal nodes with a BMC supporting Redfish 1.0+ (Dell iDRAC, HPE iLO,
# Lenovo XCC, Supermicro X11+, OpenBMC). Reads PowerConsumedWatts from the
# chassis Power resource and distributes the joules across mapped services
# proportional to their ops. Every service mapped to the same chassis
# receives the same node-level coefficient. Model tag: `redfish_bmc`.
#
# This release does NOT yet support self-signed BMC certificates. Front the
# BMC with a reverse proxy presenting a publicly-signed cert if needed.
#
# [green.redfish]
# scrape_interval_secs = 60             # default 60
# ca_bundle_path = "/etc/ssl/bmc-ca.pem"         # default unset (system trust store)
# auth_header = "Authorization: Basic BASE64"    # default unset, "Name: Value" form
# [green.redfish.endpoints]
# "chassis-1" = "https://bmc-rack-01.dc.example/redfish/v1/Chassis/1/Power"
# [green.redfish.service_mappings]
# "account-svc" = "chassis-1"

# --- Cloud CPU% + SPECpower (opt-in, no default egress) --------------------
# Alternative to Scaphandre for AWS/GCP/Azure VMs that don't expose RAPL.
# Scrapes CPU utilization from your existing Prometheus (cloudwatch_exporter,
# gcp monitoring, azure exporter) and applies the SPECpower model.
# Model tag: `cloud_specpower`.
#
# [green.cloud]
# prometheus_endpoint = "http://prometheus:9090"
# scrape_interval_secs = 30             # default 30
# default_provider = "aws"              # default unset, used when a service omits it
# default_instance_type = "c5.4xlarge"  # default unset, same
# cpu_metric = "aws_ec2_cpuutilization_average"  # default unset
# auth_header = "Authorization: Bearer TOKEN"    # default unset, "Name: Value" form
#
# Per service, either an instance type read from the embedded SPECpower
# table, or the two watt figures when your hardware is not in it.
# `cpu_query` overrides `cpu_metric` for one service.
# [green.cloud.services]
# "api-us" = { provider = "aws", instance_type = "c5.4xlarge" }
# "api-asia" = { provider = "gcp", instance_type = "n2-standard-8" }
# "analytics" = { provider = "azure", instance_type = "Standard_D8s_v3" }
# "custom" = { idle_watts = 45.0, max_watts = 120.0 }
# "special" = { provider = "aws", instance_type = "c5.4xlarge", cpu_query = "avg(node_cpu{job=\"special\"})" }

# --- Declared broker cluster (opt-in, no agent needed) ---------------------
# Messaging energy for a managed broker you cannot instrument. Declared, not
# measured: the disclosure schema keeps it in its own provenance bucket so it
# is never published as a measurement. Prefer [green.alumet.broker] when an
# agent can reach the broker cgroup.
# [green.broker_static]
# nodes = 3                      # no default, cluster size
# instance_type = "m5.large"     # no default, looked up in the SPECpower table
# provider = "aws"               # no default
# region = "eu-west-3"           # default: the service region

# --- Electricity Maps API (opt-in, requires API key) -----------------------
# Real-time per-region carbon intensity instead of the embedded hourly profile.
# Falls back to the embedded profile on any scrape failure. Model tag becomes
# `electricity_maps_api` for regions with a fresh sample.
#
# The `api_key` field accepts a literal string or the `env:VAR_NAME` form -
# prefer the env form so secrets never land in the config file.
#
# [green.electricity_maps]
# api_key = "env:ELECTRICITY_MAPS_API_KEY"
# endpoint = "https://api.electricitymap.org/v3"   # default https://api.electricitymap.org/v3
# poll_interval_secs = 900              # default 900, 15 min respects the free tier
# region_map = { "eu-west-3" = "FR", "us-east-1" = "US-MIDA-PJM", "eu-central-1" = "DE" }
# emission_factor_type = "lifecycle"    # default "lifecycle", or "direct" (combustion only)
# temporal_granularity = "hourly"       # default "hourly", or "5_minutes" / "15_minutes"

# ===========================================================================
# Public disclosure reporting (used by `disclose`, `hash-bake`, `verify-hash`)
# ===========================================================================
# [reporting]
# intent = "internal"                   # default unset, one of "internal", "official", "audited"
#                                       # /!\ "official" requires org_config_path and states the
#                                       # report is published on your organization's behalf
# confidentiality_level = "internal"    # default unset, "internal" or "public"
# org_config_path = "/etc/perf-sentinel/org.toml"      # default unset, required when intent = "official"
# disclose_output_path = "/var/lib/perf-sentinel/disclosure.json"   # default unset
# disclose_period = "calendar-quarter"  # default unset, or "calendar-month" / "calendar-year" / "custom"

# Transparency-log endpoints used when verifying a cosign attestation.
# [reporting.sigstore]
# rekor_url = "https://rekor.sigstore.dev"     # default https://rekor.sigstore.dev
# fulcio_url = "https://fulcio.sigstore.dev"   # default https://fulcio.sigstore.dev

# ===========================================================================
# Daemon configuration (only applies to `perf-sentinel watch`)
#
# Every key the daemon accepts is listed below with its default, so this
# section doubles as the checklist. An unknown key under [daemon] is ignored
# in silence, so a typo reads as a code bug rather than a config mistake:
# copy names from here rather than from memory.
#
# Full reference, with the per-key tables:
#   https://perf-sentinel.dev/docs/CONFIGURATION  (or `docs/CONFIGURATION.md`)
# ===========================================================================
[daemon]
# Bind address. /!\ `0.0.0.0` exposes ingestion and the query API to
# everything that can route to this host, use it only inside a container
# whose isolation is handled upstream.
listen_address = "127.0.0.1"       # default 127.0.0.1
# OTLP HTTP port, also serves `/metrics` and the query API.
listen_port_http = 4318            # default 4318
listen_port_grpc = 4317            # default 4317
# Unix socket for the native JSON ingestion path.
json_socket = "/tmp/perf-sentinel.sock"   # default /tmp/perf-sentinel.sock
# Traces open at once. Memory grows about linearly with it.
max_active_traces = 10000          # default 10000, warns outside 1000..100000
# How long a trace waits for late spans, in MILLISECONDS.
trace_ttl_ms = 30000               # default 30000, bounds 100..3600000
# Spans kept per trace. Past it the trace is truncated and understates.
max_events_per_trace = 1000        # default 1000, bounds 1..100000
# Max single OTLP request, in bytes. Large because a CI suite flushes its
# whole batch at JVM shutdown.
max_payload_size = 16777216        # default 16777216 (16 MiB), bounds 1024..104857600
# Findings kept in memory for `/api/findings`. 0 disables the store and the
# ack routes that read it.
max_retained_findings = 10000      # default 10000, bounds 0..10000000
# Bounded queues. Raise under bursty load to cut backpressure and shedding.
ingest_queue_capacity = 1024       # default 1024, bounds 1..1048576
analysis_queue_capacity = 1024     # default 1024, bounds 1..1048576
# Stamped on every finding as `confidence`, read by downstream tooling and
# not by the quality gate. "production" -> `daemon_production` (high),
# "staging" -> `daemon_staging` (medium). Set this to match the environment,
# the value shown is for the production daemon this file describes.
environment = "production"         # default "staging"
# Serve the query API (`/api/*`). `false` keeps OTLP ingestion and
# `/metrics`, drops every read and ack route including the dashboard's
# live mode.
api_enabled = true                 # default true

# --- /!\ Change these only if you know what you are doing -------------------
# These change what the daemon reports, or what it exposes, not how fast it
# runs. A wrong value here does not fail, it produces a daemon that answers
# confidently with less than the truth, or one reachable by more than you
# meant.
#
# Below 1.0 every count describes a sample of the traffic rather than a
# measure of it, a rare pattern can be missed entirely, and nothing
# downstream can tell the two apart. Collector-side tail sampling in front
# of the daemon does the same and cannot even be detected: prefer a second
# collector pipeline exporting here unsampled.
sampling_rate = 1.0                # default 1.0, bounds 0.0..1.0
#
# cgroup v2 admission control: past that share of the container memory
# limit, ingestion is refused before decoding rather than letting the pod
# get OOMKilled. Needs a container memory limit to mean anything. 1..5 are
# rejected, the 5-point hysteresis low bound would be unreachable.
memory_high_water_pct = 0          # default 0 (guard off), else 6..100
#
# TLS for both listeners. Both fields together or both absent. The daemon
# warns when the key file is readable by group or others.
# tls_cert_path = "/etc/tls/server-cert.pem"   # default unset (plain TCP)
# tls_key_path = "/etc/tls/server-key.pem"     # default unset (plain TCP)
#
# `[daemon.cors] allowed_origins` opens the query API to browser origins,
# see its block below.

# --- Cross-service correlation ---------------------------------------------
# Daemon-only output, batch `analyze` never produces it. Single-process, so
# it only sees what this daemon buffers: run it on one instance receiving
# every service you want correlated. Enabled here, off in the code default,
# and the cost is the pair table below.
[daemon.correlation]
enabled = true             # default false
window_minutes = 10        # default 10, in MINUTES here
lag_threshold_ms = 5000    # default 5000, max lag between two events
min_co_occurrences = 5     # default 5, pairs seen fewer times are dropped
min_confidence = 0.7       # default 0.7, below this a pair is not reported
max_tracked_pairs = 10000  # default 10000, memory ceiling for the table

# --- Runtime acknowledgments (daemon-side, JSONL) --------------------------
# Distinct from the CI baseline `.perf-sentinel-acknowledgments.toml`, which
# stays read-only at runtime. `docs/ACK-WORKFLOW.md` says which belongs
# where. Needs a durable path, see the topology block at the end.
# /!\ These routes are on by default and unauthenticated until `api_key` is
# set: any client that reaches the port can acknowledge or revoke a finding,
# which is harmless on 127.0.0.1 and is not on 0.0.0.0. Set the key whenever
# the port is reachable by anything but this host.
# [daemon.ack]
# enabled = true                                   # default true, 503 without a writable store
# storage_path = "/var/lib/perf-sentinel/acks.jsonl"  # default: OS data dir, unresolvable on scratch images
# api_key = "env:PERF_SENTINEL_ACK_API_KEY"        # default unset (NO AUTH), env: keeps it out of this file
#                                                  # at least 12 characters, 16 recommended
# toml_path = ".perf-sentinel-acknowledgments.toml"   # default .perf-sentinel-acknowledgments.toml

# --- /!\ Browser access to the query API ------------------------------------
# Empty means no browser origin can read the API, which is the safe state.
# Full origins (scheme + host + optional port, no trailing slash). "*" is
# wildcard mode and mixes neither with an explicit origin nor with
# `[daemon.ack] api_key`: that key travels on every cross-origin request, so
# any origin could then use it.
# [daemon.cors]
# allowed_origins = ["https://dashboards.example.com"]  # default [] (no browser origin)

# --- Per-window NDJSON archive (input for `disclose`) ----------------------
# Written only when `path` is set. Requires `[green] enabled = true`, the
# daemon refuses the pairing otherwise since an archive of windows with no
# energy would make `disclose` output meaningless.
# [daemon.archive]
# path = "/var/lib/perf-sentinel/archive.ndjson"   # default unset (no archive)
# max_size_mb = 100   # default 100, rotate past this size, >= 1
# max_files = 12      # default 12, rotated files kept, >= 1

# --- What your deployment topology changes ---------------------------------
# The keys above are the same everywhere the binary runs. What differs is
# whether some of them can work at all. Details:
#   https://perf-sentinel.dev/docs/HELM-DEPLOYMENT  ("Workload modes")
#
# Single process, container or Deployment (recommended): everything above
#   applies. The trace window is in memory and per process, so scale
#   vertically first.
#
# StatefulSet with persistence: the only topology where `[daemon.ack]`
#   storage and `[daemon.archive]` survive a restart, and therefore the only
#   one where runtime acks work. On a Deployment or a DaemonSet the store
#   path cannot even be resolved (scratch image, no HOME), the daemon logs a
#   WARN at startup and the two ack write routes answer 503. Note that the
#   Helm chart writes both paths itself unless you set
#   `persistence.manageDaemonPaths: false`, and refuses to render if you
#   declare them anyway.
#
# DaemonSet: one daemon per node splits the spans of a trace across pods
#   unless an upstream collector routes by trace ID (OTel `loadbalancing`
#   exporter, `routing_key: traceID`). Without it, N+1 groups fall under
#   their threshold and the findings simply never appear, with no error and
#   no metric that moves. `max_active_traces` and the queue capacities are
#   then per pod, and `[daemon.correlation]` only ever sees one node's
#   share of the traffic.
