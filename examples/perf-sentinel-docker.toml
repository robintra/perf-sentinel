# Docker-specific perf-sentinel config for the collector topology
# (`docker-compose-collector.yml`).
#
# This file only contains the overrides needed to make the daemon reachable
# from a sibling container (the OpenTelemetry Collector). For every other
# option (thresholds, detection tuning, GreenOps, Scaphandre, Electricity
# Maps, cloud energy), see `examples/perf-sentinel.toml`.
#
# To combine the optional scrapers with this Docker topology, copy this file
# and add the sections you need from `perf-sentinel.toml`, then mount the
# combined result into the container.

[daemon]
# /!\ Binds to ALL interfaces, so the collector in a sibling container can
# reach the daemon by service name. The daemon emits a security warning on
# startup: expected on a trusted container network, and only there. Anything
# that can route to this host reaches OTLP ingestion and the query API,
# including the ack routes, which are unauthenticated until
# `[daemon.ack] api_key` is set. For external exposure put a reverse proxy
# in front (nginx, traefik, envoy) with TLS and authentication.
listen_address = "0.0.0.0"         # default 127.0.0.1

# Confidence stamped on every finding, `daemon_production` here. Only
# "staging" and "production" are accepted, "prod" is rejected at load time.
# Use "staging" when this compose carries pre-production traffic, or the
# findings claim more confidence than the traffic supports.
environment = "production"         # default "staging"
