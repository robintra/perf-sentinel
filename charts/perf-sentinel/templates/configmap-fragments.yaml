{{- $fragments := .Values.config.fragments }}
{{- $persist := eq (include "perf-sentinel.persistenceEnabled" .) "true" }}
{{- if $fragments }}

{{- /* The daemon reads .perf-sentinel.d/ with `read_dir` and hard-fails on the
       first name it cannot parse (main.rs, fragment_priority): NN must be two
       ASCII digits and the slug lowercase [a-z0-9-] with no leading, trailing
       or doubled dash. A ConfigMap key is far more permissive than that, so a
       plausible-looking `green-alumet.toml` or `1-x.toml` would render, mount,
       and CrashLoopBackOff the pod with a message nobody reads until they
       exec into a container that has no shell. Fail at render instead. */}}
{{- $seen := dict }}
{{- range $name, $content := $fragments }}
{{- if not (regexMatch "^[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*\\.toml$" $name) }}
{{- fail (printf "configmap-fragments.yaml: invalid fragment name %q under config.fragments. The daemon expects NN-lowercase-name.toml, with NN two digits and the name in [a-z0-9-] (no leading, trailing or doubled dash). Example: 30-green-alumet.toml." $name) }}
{{- end }}
{{- $priority := substr 0 2 $name }}
{{- if hasKey $seen $priority }}
{{- fail (printf "configmap-fragments.yaml: duplicate fragment priority %s: %s and %s. The daemon refuses to start on two fragments sharing a priority, because their merge order would be undefined. Renumber one of them." $priority (get $seen $priority) $name) }}
{{- end }}
{{- $_ := set $seen $priority $name }}

{{- /* Fragments load before config.toml, so anything they set that config.toml
       does not restate wins. Three families of keys are cross-checked against
       the rest of the release in configmap.yaml (Service ports, probes, the
       PVC-backed ack and archive paths) and that check only reads config.toml.
       Allowing them here would let a fragment silently move the bind port away
       from the Service, or reopen a table the chart is about to append to.

       Matching them means reading TOML with a regex, which is only safe if the
       several spellings TOML allows are folded into one first. Comments go
       (a key named in prose is not a key), header whitespace goes (`[ green ]`
       is `[green]`), and quotes around key names go (`"listen_port_http"` is
       `listen_port_http`). Dropping every quote also mangles string values,
       which is harmless: nothing below matches on a value. Stripping `#`
       inside a quoted string truncates that line early, which can only lose a
       match, never invent one, and no reserved key is reachable past a `#` in
       a value. */}}
{{- $probe := regexReplaceAll "(?m)#.*$" $content "" }}
{{- $probe = regexReplaceAll "\\[[ \t]+" $probe "[" }}
{{- $probe = regexReplaceAll "[ \t]+\\]" $probe "]" }}
{{- $probe = regexReplaceAll "\"" $probe "" }}

{{- /* No spelling of a bind port is legitimate in a fragment, so match the key
       anywhere rather than enumerating line, dotted and inline-table forms. */}}
{{- if regexMatch "listen_port_(http|grpc)" $probe }}
{{- fail (printf "configmap-fragments.yaml: fragment %s sets a listen_port_* key. The chart cross-checks the bind ports against service.ports.* and the probes, and that check reads config.toml only, so a port set here would move the daemon away from where the Service routes and the probes would fail. Set it under config.toml." $name) }}
{{- end }}

{{- /* Only a problem when the chart writes those tables itself. Without
       persistence, or with manageDaemonPaths off, the operator owns them and a
       fragment is a fine place to put them, so the guard would be refusing
       valid input and pointing at a flag that changes nothing. */}}
{{- if and $persist $.Values.workload.statefulset.persistence.manageDaemonPaths }}
{{- if or (regexMatch "(?m)^[ \t]*(\\[daemon\\.(ack|archive)\\]|(daemon\\.)?(ack|archive)([\\. \t]|[ \t]*=))" $probe) (regexMatch "daemon[ \t]*=[ \t]*\\{[^}]*(ack|archive)" $probe) }}
{{- fail (printf "configmap-fragments.yaml: fragment %s declares [daemon.ack] or [daemon.archive], and persistence has the chart appending both tables to config.toml. TOML rejects a table defined twice. Set workload.statefulset.persistence.manageDaemonPaths=false and own both paths yourself, or move them to config.toml." $name) }}
{{- end }}
{{- end }}

{{- /* Green scoring off decides whether configmap.yaml appends an archive, and
       it reads config.toml alone. All three spellings, since the daemon
       refuses to start on archive-plus-green-off whichever one is used. */}}
{{- range regexSplit "(?m)^[ \t]*\\[" $probe -1 }}
{{- if and (hasPrefix "green]" .) (regexMatch "(?m)^[ \t]*enabled[ \t]*=[ \t]*false" .) }}
{{- fail (printf "configmap-fragments.yaml: fragment %s sets [green] enabled = false. The chart decides whether to append [daemon.archive] from config.toml alone, and the daemon refuses an archive with green scoring off. Set it under config.toml." $name) }}
{{- end }}
{{- end }}
{{- if or (regexMatch "(?m)^[ \t]*green\\.enabled[ \t]*=[ \t]*false" $probe) (regexMatch "green[ \t]*=[ \t]*\\{[^}]*enabled[ \t]*=[ \t]*false" $probe) }}
{{- fail (printf "configmap-fragments.yaml: fragment %s turns [green] enabled off through a dotted key or an inline table. Same reason as the table spelling: set it under config.toml." $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perf-sentinel.fragmentsConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perf-sentinel.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $name, $content := $fragments }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
