{{- if eq .Values.workload.kind "DaemonSet" -}}
{{- if not .Values.workload.daemonset.spanRoutingByTraceId }}
{{- fail "daemonset.yaml: workload.kind is DaemonSet but workload.daemonset.spanRoutingByTraceId is false. Correlation is per-trace and in-memory, so spans of one trace landing on different pods are analyzed in pieces: N+1 groups fall under their threshold and disappear, with no error and no metric to notice it by. A Service in front of a DaemonSet round-robins, so it does split them. Use workload.kind=Deployment with replicas=1 (the recommended topology), or set spanRoutingByTraceId=true if an upstream collector routes by trace ID to these pods." }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "perf-sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perf-sentinel.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.workload.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "perf-sentinel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "perf-sentinel.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "perf-sentinel.podLabels" . | nindent 8 }}
    spec:
      {{- include "perf-sentinel.podSpec" . | nindent 6 }}
{{- end }}
