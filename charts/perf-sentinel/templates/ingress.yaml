{{- if .Values.ingress.enabled -}}
{{- $fullName := include "perf-sentinel.fullname" . -}}
{{- $svcPort := .Values.ingress.servicePortName -}}
{{- if not (has $svcPort (list "otlp-http" "otlp-grpc")) -}}
{{- fail (printf "ingress.servicePortName must be otlp-http or otlp-grpc, got %q. Those are the only ports the Service publishes." $svcPort) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perf-sentinel.labels" . | nindent 4 }}
  {{- $annotations := merge (deepCopy (.Values.ingress.annotations | default dict)) (.Values.commonAnnotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
