{{- if .Values.networkPolicy.enabled -}}
{{- $in := .Values.networkPolicy.ingress }}
{{- $grpc := .Values.service.ports.otlpGrpc.port }}
{{- $http := .Values.service.ports.otlpHttp.port }}
{{- /* One rule per peer list: both ports, gRPC only, HTTP only. */}}
{{- $rules := list
      (dict "peers" $in "ports" (list $grpc $http))
      (dict "peers" (default (dict) $in.otlpGrpc) "ports" (list $grpc))
      (dict "peers" (default (dict) $in.http) "ports" (list $http)) }}
{{- $any := false }}
{{- range $rules }}
{{- if or .peers.fromNamespaceSelectors .peers.fromPodSelectors }}{{ $any = true }}{{ end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "perf-sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "perf-sentinel.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "perf-sentinel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if $any }}
  ingress:
    {{- range $rules }}
    {{- if or .peers.fromNamespaceSelectors .peers.fromPodSelectors }}
    - from:
        {{- range .peers.fromNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range .peers.fromPodSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
  {{- else }}
  # No ingress selectors supplied: deny all ingress (fail-closed). Add
  # entries under .Values.networkPolicy.ingress (both ports), .otlpGrpc or
  # .http to allow-list specific peers.
  ingress: []
  {{- end }}
{{- end }}
