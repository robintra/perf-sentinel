# Default values for perf-sentinel.
# This is a YAML-formatted file. Override with -f values-override.yaml or --set.

# -- Container image settings.
image:
  # -- Container image repository.
  repository: ghcr.io/robintra/perf-sentinel
  # -- Image tag. When empty, falls back to .Chart.AppVersion so `helm upgrade`
  # to a newer chart automatically picks up the matching daemon version.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- imagePullSecrets, e.g. `[ { name: myRegistryKey } ]`.
  pullSecrets: []

# -- Override the chart name. Defaults to `.Chart.Name`.
nameOverride: ""
# -- Override the full release name. Defaults to `.Release.Name-<chart name>`.
fullnameOverride: ""

# Workload shape. perf-sentinel is a stateful-per-trace in-memory daemon, so
# Deployment with replicas=1 is the default and recommended topology. See
# docs/HELM-DEPLOYMENT.md for the trade-offs of each mode.
workload:
  # -- One of: Deployment, DaemonSet, StatefulSet.
  kind: Deployment
  # -- Number of replicas. Ignored when kind=DaemonSet.
  replicas: 1
  # -- Strategy for Deployment. Ignored for DaemonSet/StatefulSet.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- updateStrategy for DaemonSet/StatefulSet. Ignored for Deployment.
  updateStrategy:
    type: RollingUpdate
  # DaemonSet-specific settings.
  daemonset:
    # -- Assert that every span of a trace reaches the same pod. Correlation is
    # per-trace and in-memory, so a trace split across pods is detected in
    # pieces: N+1 groups fall under their threshold and go missing, silently.
    # A plain Service in front of a DaemonSet round-robins and does split them.
    # Set to true only when an upstream collector routes by trace ID (for
    # example the OTel `loadbalancing` exporter with `routing_key: traceID`
    # pointing at this DaemonSet, not at a ClusterIP). Rendering fails
    # otherwise.
    spanRoutingByTraceId: false
  # StatefulSet-specific settings. Enabling persistence gives the daemon a
  # durable PVC and points the runtime ack store and the public-disclosure
  # archive at it, so both survive restarts and pod rescheduling.
  statefulset:
    # -- Headless Service name used by the StatefulSet. Leave empty and the
    # chart renders `<fullname>-headless` itself. Set it to point the
    # StatefulSet at a headless Service you manage, and the chart renders
    # none. spec.serviceName is immutable, so changing this on a live
    # StatefulSet requires deleting it first (--cascade=orphan keeps the
    # pods and PVCs).
    serviceName: ""
    persistence:
      # -- When true (StatefulSet only), render a volumeClaimTemplate mounted
      # at /var/lib/perf-sentinel and point [daemon.ack] storage_path plus
      # [daemon.archive] path at it (see templates/configmap.yaml). Acks and
      # the disclosure archive then persist across restarts. Off by default,
      # and runtime acks do not work without it.
      enabled: false
      # -- When true (the default), the chart writes [daemon.ack] storage_path
      # and [daemon.archive] path itself. It then refuses to render if
      # config.toml touches either table, in any TOML spelling, because a
      # table cannot be opened twice. Set this to false to own both tables in
      # config.toml, for instance to pass [daemon.ack] toml_path or
      # [daemon.archive] max_size_mb, and write the durable paths yourself
      # under /var/lib/perf-sentinel.
      manageDaemonPaths: true
      size: 1Gi
      accessModes:
        - ReadWriteOnce
      # -- Leave empty to use the cluster default StorageClass.
      storageClass: ""

# Service account. The daemon never calls the Kubernetes API, so the default
# mounts no token. Override only if you wire perf-sentinel into a sidecar
# pattern that needs downward API access.
serviceAccount:
  create: true
  # -- Name of an existing ServiceAccount. Ignored when create=true.
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# Pod-level security context. UID 65534 matches the scratch-based Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. readOnlyRootFilesystem relies on the
# chart-mounted /tmp emptyDir (see templates/deployment.yaml) for the
# default json_socket path.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
      - ALL

# Resource requests and limits, sized to the measured daemon footprint:
# it idles near 17Mi but holds ~150-190Mi RSS under sustained ingestion
# (README "Performance" memory profile, docs/RUNBOOK.md "Sizing reference").
# The limit must cover the loaded peak, not the idle RSS, or the kernel
# OOMKills the pod under load. The throughput plateau is CPU-bound, so raise
# limits.cpu first for heavy traffic. Mirrored by the raw-manifest baseline
# in docs/INSTRUMENTATION.md.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Scheduling knobs. Empty defaults so nothing is forced on the user.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Liveness and readiness probes. Both hit /health, which is always on,
# lock-free, and independent of [daemon] api_enabled. The port is named so
# changing service.ports.otlpHttp.port does not break the probes.
#
# The liveness budget is deliberately looser than the readiness one
# (docs/RUNBOOK.md "Sizing reference"): under sustained saturation the whole
# cgroup is throttled in quanta, and a tight liveness budget restarts a
# functional daemon that is merely backpressuring. Readiness stays tight on
# purpose, dropping the pod from the Service endpoints is the wanted response
# to saturation, a restart is not.
livenessProbe:
  httpGet:
    path: /health
    port: otlp-http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health
    port: otlp-http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# Service shape. ClusterIP is correct for the in-cluster fan-in pattern
# (collector -> perf-sentinel). Avoid NodePort or LoadBalancer unless a
# reverse proxy or NetworkPolicy gates the perimeter.
service:
  type: ClusterIP
  annotations: {}
  ports:
    otlpGrpc:
      port: 4317
      # -- Hint for service meshes that honor appProtocol.
      appProtocol: grpc
    otlpHttp:
      port: 4318

# Prometheus Operator ServiceMonitor. Gated so clusters without the operator
# render a minimal chart.
serviceMonitor:
  enabled: false
  # -- Namespace where the ServiceMonitor is created. Defaults to the release
  # namespace when empty.
  namespace: ""
  interval: 15s
  scrapeTimeout: 10s
  # -- Extra labels applied to the ServiceMonitor (e.g. `release: prometheus`
  # for the kube-prometheus-stack operator selector).
  labels: {}
  # -- Prometheus relabeling rules applied before scraping.
  relabelings: []
  # -- Prometheus relabeling rules applied after scraping.
  metricRelabelings: []

# Prometheus Operator PrometheusRule. Ships the daemon's loss and saturation
# alerts so "alerts the moment a problem appears" works out of the box instead
# of being a build-it-yourself wiring exercise. Gated like serviceMonitor.
prometheusRule:
  enabled: false
  # -- Namespace where the PrometheusRule is created. Defaults to the release
  # namespace when empty.
  namespace: ""
  # -- Extra labels applied to the PrometheusRule (e.g. `release: prometheus`
  # for the kube-prometheus-stack operator's ruleSelector).
  labels: {}
  # -- Also emit per-backend energy-scraper staleness alerts. Only meaningful
  # when an energy backend (Alumet, Scaphandre, Kepler, Redfish, cloud_energy)
  # is configured, off by default so a proxy-only deploy is not alerted on a
  # backend it does not run.
  energyScrapers: false
  # -- Staleness threshold (seconds) for the energy-scraper alerts.
  scraperStaleSeconds: 120
  # -- Extra rules appended verbatim to the perf-sentinel.rules group.
  additionalRules: []

# PodDisruptionBudget. maxUnavailable: 1 by default rather than minAvailable: 1,
# because the daemon runs single-replica (replicas=1) and a minAvailable: 1 PDB
# would block every voluntary drain and wedge node maintenance. Set minAvailable
# only when you run a trace-aware sharded topology with several replicas.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  # -- Set to take precedence over maxUnavailable. Leave empty for single-replica.
  minAvailable: ""

# NetworkPolicy. Fail-closed: when enabled without selectors the rendered
# policy blocks every ingress, including the Prometheus scrape and `helm test`.
# Add namespace or pod selectors below to allow-list the collector, Prometheus,
# or application namespaces.
#
# The probes keep passing either way. Kubernetes guarantees that "traffic to
# and from the node where a Pod is running is always allowed, regardless of the
# IP address of the Pod or the node", so the kubelet reaches /health through any
# policy (verified on k3s/kube-router 1.35). The failure mode is therefore a
# green pod that receives nothing, not a CrashLoop.
#
# Egress is deliberately out of scope. The daemon's outbound destinations
# (Tempo, Jaeger, Electricity Maps, the energy scrapers) are declared in your
# config.toml, not in the chart, so a generic egress block would either be too
# permissive to protect anything or strict enough to break the install.
# NetworkPolicies are additive, write your own egress policy alongside.
networkPolicy:
  enabled: false
  ingress:
    # -- Array of namespaceSelector blocks, applied as an OR list.
    # Example: `[ { matchLabels: { kubernetes.io/metadata.name: observability } } ]`.
    fromNamespaceSelectors: []
    # -- Array of podSelector blocks, applied as an OR list.
    # Example: `[ { matchLabels: { app.kubernetes.io/name: otel-collector } } ]`.
    fromPodSelectors: []

# The daemon config, rendered into a ConfigMap and mounted
# read-only at /etc/perf-sentinel/.perf-sentinel.toml. Edits roll the pods
# via a checksum/config annotation on the podTemplate.
#
# Secrets must never land here. Use extraEnvFrom + a Secret for tokens
# such as PERF_SENTINEL_EMAPS_TOKEN.
config:
  toml: |
    # Managed by the perf-sentinel Helm chart. Edit via values.yaml and
    # `helm upgrade`. See docs/CONFIGURATION.md for the full reference.

    [thresholds]
    n_plus_one_sql_critical_max = 0
    n_plus_one_http_warning_max = 3
    io_waste_ratio_max = 0.30

    [detection]
    n_plus_one_min_occurrences = 5
    window_duration_ms = 500
    slow_query_threshold_ms = 500
    slow_query_min_occurrences = 3

    [green]
    enabled = true
    # default_region = "eu-west-3"

    [daemon]
    # 0.0.0.0 is required inside a pod so the ClusterIP Service can route
    # to the container. Upstream access control is the Service and the
    # optional NetworkPolicy, not a loopback bind.
    listen_address = "0.0.0.0"
    listen_port_http = 4318
    listen_port_grpc = 4317
    environment = "staging"
    api_enabled = true
    # The daemon runs inside a non-exposed cluster network and has no embedded
    # IAM (see docs/QUERY-API.md): access control is the Service and, when you
    # want it, the NetworkPolicy. The ack store stays on so acks (and the
    # committed TOML acks the daemon loads with them) work out of the box; a
    # non-loopback bind just logs an advisory, it does not require a key.
    #
    # To restrict who may acknowledge findings:
    #   - only-this-group (architects / SRE): front the API with an SSO proxy
    #     that authorizes ack writes by group (docs/QUERY-API.md), and add a
    #     networkPolicy peer selector so only the proxy reaches the daemon.
    #   - coarse shared key: create a Secret whose PERF_SENTINEL_ACK_API_KEY
    #     entry is your key and expose it via extraEnvFrom (it overrides the
    #     config api_key). See docs/HELM-DEPLOYMENT.md.
    # Reject OTLP ingest when cgroup v2 memory crosses this percent of the
    # container limit, bounding RSS against OOM. 0 disables (default), 6 is the
    # minimum non-zero value (5-point hysteresis band). Set
    # 80-85 when resources.limits.memory is tight.
    # memory_high_water_pct = 0

    # sampling_rate is deliberately left at its 1.0 default. Below 1.0 the
    # daemon drops whole traces, so the waste ratio, the GreenOps figures and
    # the finding counts all become a sample of the traffic rather than a
    # measure of it. The report says so (a `tuning` entry in warning_details),
    # but the numbers themselves do not carry the correction.
    # The same applies to sampling applied upstream: a collector running
    # tail_sampling in front of this daemon feeds it a fraction of the traffic,
    # and there is no config here that can tell. Send perf-sentinel an
    # unsampled pipeline where you can. See
    # docs/HELM-DEPLOYMENT.md#collector-sampling-and-what-reaches-the-daemon.
    # sampling_rate = 1.0

    # [daemon.correlation]
    # enabled = true
    # window_minutes = 10
    # lag_threshold_ms = 2000

# Pod-level annotations and labels. `checksum/config` is injected by the
# template, so do not set it here.
podAnnotations: {}
podLabels: {}

# Labels and annotations propagated to every rendered object.
commonLabels: {}
commonAnnotations: {}

# Extra environment variables passed to the daemon container.
# -- Direct env entries, appended as-is.
extraEnv: []
# -- envFrom entries, typical use is injecting secret tokens such as
# `PERF_SENTINEL_EMAPS_TOKEN` via a Secret. Example:
# extraEnvFrom:
#   - secretRef:
#       name: perf-sentinel-secrets
extraEnvFrom: []

# Extra volumes and volumeMounts, e.g. for a calibration file or TLS certs.
extraVolumes: []
extraVolumeMounts: []

# Extra arguments appended to the daemon command. The chart always starts
# with `["watch", "--config", "/etc/perf-sentinel/.perf-sentinel.toml"]`.
extraArgs: []
