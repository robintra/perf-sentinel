apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.11.0
appVersion: "0.11.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "Chart 0.11.0: the ServiceMonitor no longer matches the headless Service. It selects on the shared selector labels, which the headless Service a StatefulSet needs for pod DNS carries too, so every pod was scraped twice and reported under two jobs (<release> and <release>-headless). Every Grafana panel rendered each value twice, and a stat panel showed two numbers side by side. The headless Service now carries app.kubernetes.io/component: headless and the ServiceMonitor excludes it with a NotIn expression, which still matches the main Service since it does not carry the key. Only workload.kind=StatefulSet with serviceMonitor.enabled was affected."
    - kind: changed
      description: "appVersion 0.11.0: [detection] grouping_attributes selects the ordered resource or span attributes that separate deployments, defaulting to k8s.namespace.name then service.namespace. SpanEvent and Finding retain every configured attribute found, while the first present key=value separates recurrences, daemon coalescing, diff identity and cross-trace correlations. Acknowledgment signatures are untouched, so one ack still covers every grouping. /api/correlations carries grouping_key and namespace (the value) per endpoint and never pairs different grouping identities. The ServiceMonitor and headless Service templates changed for the duplicate-scrape fix above; values and pod templates are unchanged, so upgrading does not roll pods. Another minor rather than patch bump: the public structs grew fields again, which a downstream crate pinned to 0.10 cannot absorb on a patch number."
    - kind: added
      description: "Chart 0.10.0: an optional Ingress, off by default. ingress.enabled=true renders a networking.k8s.io/v1 Ingress in front of the Service, with className, per-controller annotations, hosts[].paths[] and tls[] passed through, and servicePortName choosing otlp-http (4318: OTLP HTTP, query API, /metrics) or otlp-grpc (4317). Any other port name fails the render, because the Service publishes no other one and the mistake would otherwise surface as a 503 at request time. Off by default is a security decision, not a packaging one: perf-sentinel has no embedded IAM, so publishing it exposes OTLP ingest, /api/findings (your SQL templates and endpoint names) and the ack write endpoints to whoever reaches the host. Put an SSO proxy or a controller auth annotation in front of it, see docs/HELM-DEPLOYMENT.md. Enabling an Ingress does not relax the NetworkPolicy: with both on, allow the controller's pods as a peer or every request times out."
    - kind: changed
      description: "appVersion 0.10.0: a minor bump rather than a patch. The published perf-sentinel-core library gained breaking API changes (public structs grew fields, quality_gate::evaluate takes a fourth parameter), and a downstream crate pinned to 0.9 would have broken on a patch number that promises it cannot. The chart and the daemon it deploys are unaffected: no template change, no values change, and a values file that rendered on 0.9.28 renders identically here, checksum/config included, so upgrading does not roll pods."
    - kind: fixed
      description: "appVersion 0.9.28: the daemon accepts gzip and deflate compressed OTLP exports on both ports. The OTel Collector's OTLP exporter compresses with gzip by default, and the gRPC listener answered it with a non-retryable Unimplemented, so a collector left at its defaults had every batch dropped on the floor while the pod stayed green and its /metrics counters stayed at zero. The HTTP port already accepted gzip and now takes deflate too, so the two ports accept the same encodings, while snappy and zstd are still refused on both and must be changed back to gzip or none. The size cap keeps applying to the decompressed message, so max_payload_size still bounds a compressed payload, but it now caps what an export expands to rather than what a client uploaded: on a pod with a memory limit, raise daemon.memory_high_water_pct off its default before accepting compressed ingest. On earlier versions the workaround is compression: none on the exporter."
    - kind: added
      description: "Chart 0.9.27: the new config.fragments value carries ordered TOML documents into /etc/perf-sentinel/.perf-sentinel.d/, which the daemon merges ahead of config.toml. This is how the ready-to-copy GreenOps backends in examples/ reach a cluster without being pasted into one large document, and examples/helm/ gains one values overlay per backend (alumet, cloud, scaphandre, kepler, redfish, electricity-maps) stackable on the base values with a second -f. Fragment names and the reserved keys the chart cross-checks against the Service, the probes and the PVC are validated at render time, because the daemon rejects them at startup and the FROM scratch image leaves no shell to read the failure in. Editing a fragment moves checksum/config, so helm upgrade rolls the pods. Additive: at equal chart version, a values file with no config.fragments renders identically to 0.9.26, checksum/config included, so upgrading does not roll pods over a config that did not change."
    - kind: fixed
      description: "Chart 0.9.27: examples/helm/values-perf-sentinel.yaml regains n_plus_one_messaging_warning_max, which the bundled config.toml has carried since chart 0.9.23 and the example had drifted from. A values file copied from that example kept the daemon default rather than the documented threshold. The new scripts/test/examples-helm-load-test.sh renders every example, projects it the way kubelet does and loads it with a real binary, so a published example that would not boot fails CI instead of a pod."
    - kind: added
      description: "appVersion 0.9.26: the HTML report highlights the spans behind a serialized_calls or excessive_fanout finding instead of the parent span that contains them. Both findings take their template from that parent, and a serialized chain cannot be rebuilt in a browser since an embedded span carries no timestamp, so the report now ships the span ids the detectors selected, matched back to the findings it publishes. No chart-visible change: this is the report perf-sentinel report produces, which the daemon this chart deploys does not render."
    - kind: changed
      description: "appVersion 0.9.26: the findings list in the HTML report sorts by descending severity, so the first page carries the worst rows. The sort is stable, so the deterministic detector order survives inside each severity band, and the paginated list, the counter, the sidebar badge and the CSV export all agree on it."
    - kind: fixed
      description: "appVersion 0.9.26: the help icon on every finding type, data tab and carbon card of the HTML report becomes a real control, reachable by tab, showing its summary on focus and opening its method sheet on Enter or Space. Its tooltip also widens to fit a code snippet rather than spilling past its border, and is clamped at the left viewport edge. No daemon-visible change."
    - kind: added
      description: "appVersion 0.9.25: the daemon hash-chains the windows it archives when [daemon.archive] is configured. Each NDJSON line records the hash of its own content, the hash of the previous line and its position in the file, so a window edited, removed, reordered or truncated after it was written becomes detectable, and disclose publishes the verdict as windows verified, windows written before chaining existed, and breaks found. Archives written by earlier versions stay readable and count as unchained rather than broken. Each window is now flushed as it is written, so an ungraceful pod kill no longer leaves a half-written line that would read as tampering on restart. Tamper-evidence after the fact, not proof of a sincere source: whoever controls the daemon and its files can regenerate a consistent chain."
    - kind: changed
      description: "appVersion 0.9.25: three [green] keys tighten in a mounted config.toml. network_energy_per_byte_kwh is deprecated and ignored, the transport coefficient is fixed at 0.04 kWh/GB and the disclosure publishes a sourced 0.001-0.059 kWh/GB bracket beside the term. include_network_transport is deprecated and ignored, the term is always computed, displayed and disclosed. embodied_carbon_per_request_gco2 = 0.0 warns and falls back to the default, a zeroed coefficient erased the embodied term from the disclosure, and no key in this release turns an upgrade into a boot failure. Every carbon_breakdown term is now omitted rather than published as zero when nothing measured it."
    - kind: changed
      description: "appVersion 0.9.25: the periodic disclosure schema moves to perf-sentinel-report/v1.6. Reports now publish the carbon parameters that scale their own figures (the SCI methodology tags observed over the period, and the embodied term as a total and a per-request mean), split the carbon total into its operational, embodied and transport terms so a reader can tell the reducible part from the irreducible one, and carry the source-chain verdict in integrity.trace_integrity_chain. Additive: a report produced by an earlier version keeps its content_hash when re-hashed on this binary."
    - kind: fixed
      description: "appVersion 0.9.25: perf-sentinel capture creates the directory of --output when it is missing. The documented CI recipe writes to target/traces.json, and a CI workspace starts clean: the build tool creates target/, and in wrapper mode the build tool is the command capture wraps, so it has not run yet. capture refused to start, and because it refuses before spawning, the wrapped test suite never ran and the job failed pointing at a trace file. No chart-visible change: capture is a CLI subcommand for CI jobs, the daemon deployment this chart installs is unaffected."
    - kind: added
      description: "appVersion 0.9.24: the new perf-sentinel capture subcommand receives OTLP and writes the NDJSON trace file analyze --ci gates on, which removes the OpenTelemetry Collector from the CI path. It matters because most runtimes cannot hand over a trace file at all: of the six languages tracked by the OpenTelemetry configuration project only C++ and PHP implement an exporter that writes to a chosen path, and a forked Maven test JVM cannot even yield its stdout, which Surefire uses as its command channel. Either wrap the test step (capture --output traces.json -- mvn verify) or run alongside it and stop on a signal. No chart-visible change: capture is a CLI subcommand for CI jobs, the daemon deployment this chart installs is unaffected."
    - kind: fixed
      description: "appVersion 0.9.24: an OTLP attribute carrying no value ({\"key\":\"k\",\"value\":{}}) no longer fails the whole ingest, and an empty trace file is rejected with a message that names the cause instead of a bare JSON parse error. The first shape is emitted by the opentelemetry-java stdout exporter, and a single such attribute previously cost every trace in the file. Both paths are shared with the daemon ingest this chart deploys."
    - kind: added
      description: "appVersion 0.9.23: OpenTelemetry messaging spans are ingested (Kafka, RabbitMQ, Pulsar, SQS, NATS, JMS), with two dedicated finding types and producer-to-consumer resolution through span links. Broker energy can now be attributed to those findings: [green.alumet.broker] measures the broker cgroup, [green.broker_static] declares a provisioned cluster and needs no agent, which is the only path open on a managed broker. Either figure is reported as green_summary.messaging_waste with a model tag saying where it came from, and the periodic disclosure moves to schema v1.5 with a third provenance bucket so a declared cluster is never published as a measurement."
    - kind: changed
      description: "Chart 0.9.23: the bundled Grafana dashboard gains a messaging p95 series, an OTLP span intake panel, the alumet, kepler and redfish gauges on the energy freshness panel, and analysis batch shedding on the headroom panel. Every panel description now states how to read the metric. config.toml accepts the two new [green.*] broker sections. No template changes, but the default config.toml gains the fourth quality-gate rule n_plus_one_messaging_warning_max = 3, so a values file keeping the bundled default now fails the gate on a service carrying four or more warning-or-higher N+1 messaging findings. Override the threshold under config.toml to keep the previous behaviour."
    - kind: changed
      description: "appVersion 0.9.22: source_endpoint resolves the inbound HTTP route by walking the parent chain instead of the direct parent only, then falls back to the code frame for entry points that carry no HTTP attribute (scheduled jobs, message consumers), on the OTLP, Jaeger and Zipkin paths alike. The daemon also warns when [daemon] sampling_rate makes its counts a sample. Breaking: findings whose endpoint was unknown change acknowledgment signature and must be re-recorded, see the application CHANGELOG migration notes. appVersion realigns with the chart version after the chart-only 0.9.18 through 0.9.21 releases."
    - kind: changed
      description: "Chart 0.9.22 (breaking for workload.kind=DaemonSet): the render now fails unless workload.daemonset.spanRoutingByTraceId is set to true, so a values file that installed under 0.9.21 stops installing here and a CD pipeline tracking the chart fails its next reconcile until the value is set. Correlation is per-trace and in-memory, so spans of one trace landing on different pods are analyzed in pieces: N+1 groups fall under their threshold and the findings never appear, with no error and no metric that moves. A plain Service in front of a DaemonSet round-robins and does split traces, which makes the naive setup the broken one. The opt-in is the operator asserting that an upstream collector routes by trace ID to these pods, for example the OTel loadbalancing exporter with routing_key traceID. Deployment with replicas 1 stays the default and recommended topology, and is unaffected."
    - kind: changed
      description: "Chart 0.9.22: the embedded config.toml documents why sampling_rate stays at its 1.0 default, and where collector sampling belongs relative to the daemon. Below 1.0 the finding counts and the Prometheus totals describe a sample of the traffic rather than a measure of it and a rare pattern can be missed entirely, and the same holds for a collector running tail_sampling in front of the daemon, which perf-sentinel cannot detect at all since a kept trace is indistinguishable from a complete one. Sampling bounds what a trace store retains and the daemon retains nothing beyond an in-memory per-trace window, so the recommended layout is a second collector pipeline exporting to perf-sentinel without the sampler. Comment-only change to the rendered ConfigMap, no behavior change."
    - kind: added
      description: "Chart 0.9.21: a post-install note fires whenever the install cannot persist runtime acknowledgments, which is every mode except StatefulSet with persistence enabled. The daemon resolves its ack store under a home directory the scratch image does not provide, so it logs a WARN at startup and the three ack routes answer 503, while ingestion, detection, metrics and the rest of the query API keep working and the committed CI ack baseline is still honoured. That mismatch previously surfaced only as an unexplained 503 hours later, because [daemon.ack] enabled defaults to true in the daemon while the chart's default topology cannot serve it. The note names the two values to set and warns that the mode needs a usable StorageClass. Deployment stays the default so the chart still installs on a cluster with no default StorageClass."
    - kind: fixed
      description: "Chart 0.9.20: three render-time guards replace three silent failures. [daemon.archive] is no longer injected when config.toml sets [green] enabled = false, a pairing the daemon rejects at startup, which turned detection-without-GreenOps plus persistence into a CrashLoopBackOff, and declaring that archive yourself now fails the render in every workload mode since the daemon refuses it either way. A service.ports.*.port moved without the matching [daemon] listen_port_* now fails the render instead of producing a pod that binds one port while the containerPort, the probes, the Service and the NetworkPolicy all point at another, with an omitted key checked against the daemon's own 4318 and 4317 defaults rather than skipped. And workload.statefulset.persistence.enabled on a Deployment or DaemonSet fails the render instead of rendering no volume at all and leaving the ack routes on 503 with no explanation."
    - kind: fixed
      description: "Chart 0.9.20: the helm test pod's app.kubernetes.io/name label is truncated to 63 characters. perf-sentinel.name is already truncated at 63 and the -test suffix pushed the label past the DNS label limit under a long nameOverride, which the API server rejects."
    - kind: changed
      description: "Chart 0.9.20: values.schema.json accepts resources.claims, a standard Kubernetes field since 1.26 that the schema rejected while the chart advertises kubeVersion >=1.24.0-0. serviceMonitor.interval and scrapeTimeout accept the full Prometheus Operator duration grammar, the previous pattern rejected composed durations such as 1m30s plus 1d, 1w and 1y."
    - kind: fixed
      description: "Chart 0.9.20: a config.toml that declares [daemon.ack] or [daemon.archive] no longer produces a ConfigMap the daemon cannot parse. With persistence enabled the chart appended both tables unconditionally, so an operator setting [daemon.ack] api_key or toml_path, or [daemon.archive] max_size_mb, ended up with the same table twice in the rendered TOML, which the parser rejects and the daemon crash-loops on. Ownership is now explicit through the new workload.statefulset.persistence.manageDaemonPaths value, true by default: the chart writes both durable paths and refuses to render as soon as config.toml mentions either table, whether opened by a header, a dotted key such as ack.storage_path under [daemon], or an inline table. Set it to false to own both tables yourself. Deployment and DaemonSet installs are unaffected, no table is injected there."
    - kind: added
      description: "Chart 0.9.19: workload.kind=StatefulSet now renders the headless Service it needs. The StatefulSet's spec.serviceName pointed at the regular ClusterIP Service, which gives no per-pod DNS identity, so the mode only ever delivered the PVC. The chart renders <fullname>-headless (clusterIP None, publishNotReadyAddresses true) and points spec.serviceName at it, and renders nothing when workload.statefulset.serviceName names a Service you manage. Migration: spec.serviceName is immutable, so an existing StatefulSet release must be deleted before upgrading (kubectl delete statefulset --cascade=orphan keeps the pods and PVCs). Deployment and DaemonSet are unaffected."
    - kind: fixed
      description: "Chart 0.9.19: the helm test pod no longer carries the workload selector labels, so the PodDisruptionBudget stops counting it and the Service stops selecting it during a test run. It now carries app.kubernetes.io/name <name>-test plus component test. The Service never actually routed to it, the named targetPort could not resolve against a pod that declares no ports, but the overlap was accidental rather than intended."
    - kind: fixed
      description: "Chart 0.9.19: the pod template carries the standard labels every other rendered object already had (helm.sh/chart, app.kubernetes.io/version, app.kubernetes.io/managed-by), aligning with the Helm chart best practices and with what helm create scaffolds. Selector labels are untouched, so spec.selector stays immutable and no migration is needed, but the pod template hash changes and helm upgrade rolls the pod."
    - kind: removed
      description: "Chart 0.9.19: the artifacthub.io/official annotation is dropped. It is not one of the 16 Helm annotations Artifact Hub documents and reads, so it was inert, and an inert self-declaration of official status is misleading. The official status is requested through a GitHub issue after the repository holds the verified-publisher badge."
    - kind: changed
      description: "Chart 0.9.19: documentation of two deliberate scope decisions, no template change for either. The NetworkPolicy stays ingress-only because the daemon's outbound destinations (Tempo, Jaeger, Electricity Maps, the energy scrapers) are declared in the operator's config.toml and not knowable by the chart, and NetworkPolicies are additive so an egress policy belongs alongside. The chart ships no Helm .prov file, so helm install --verify is unavailable by design: Helm's native provenance needs a long-lived PGP key in CI, while cosign keyless plus the SLSA attestation answer the same question with no static signing key. A post-install note now fires when networkPolicy.enabled is set with no ingress selector, the fail-closed case that also blocks the ServiceMonitor scrape and helm test while rendering and validating cleanly."
    - kind: fixed
      description: "Chart 0.9.18: setting workload.strategy.type=Recreate no longer renders an invalid Deployment. The default values merge left the rollingUpdate block in place, and the API rejects it outright when the type is Recreate, so the install failed. service.type is also no longer allowed to be ExternalName in values.schema.json, since the chart always renders a selector and ports and never spec.externalName, which the API rejects as well. Chart-only fix, appVersion unchanged (still 0.9.17)."
    - kind: fixed
      description: "Chart 0.9.18: commonLabels now reach the pod template. They were applied to every rendered object except the podTemplate, so pod-level selectors (chargeback, policy, log routing) built on a common label matched nothing. Selector labels are untouched, so the change is a pod-template-only rollout on upgrade. Chart-only fix, appVersion unchanged."
    - kind: changed
      description: "Chart 0.9.18: the default liveness probe budget moves to timeoutSeconds 5 and failureThreshold 5, the value docs/RUNBOOK.md has recommended since appVersion 0.8.7. Under sustained saturation the cgroup is throttled in quanta and the previous 2s/3-failure budget restarted a functional daemon that was merely backpressuring. The readiness probe stays tight on purpose, dropping the pod from the Service endpoints is the wanted response to saturation. Chart-only change, appVersion unchanged."
    - kind: changed
      description: "appVersion 0.9.17: the chart version and appVersion realign at 0.9.17 after the chart-only 0.9.16 fix, so 0.9.16 is skipped for the application. The batch subcommands now exit 75 for a runtime tooling failure (missing or malformed input, config, acknowledgments or baseline file, a tempo/jaeger-query fetch failure, an explain trace-not-found, or a report-write failure) instead of the 1 reserved for a genuine quality-gate breach on analyze --ci / tempo --ci / jaeger-query --ci. Usage errors exit 2. No chart template change, this bump tracks the new appVersion."
    - kind: fixed
      description: "Chart 0.9.16: values.schema.json allows a top-level `global` object. Helm's own convention injects `global` into every subchart's values when this chart is installed as a dependency of an umbrella chart, and the schema's additionalProperties: false at the root rejected it outright with 'additional properties global not allowed', a hard install failure any values file or wrapper chart setting global tripped. The chart has no subcharts and reads nothing from global itself. Chart-only fix, appVersion unchanged (still 0.9.15). The next appVersion bump jumps to 0.9.17 to restore the chart/appVersion lockstep, so 0.9.16 is deliberately skipped for the application."
    - kind: changed
      description: "appVersion 0.9.15: application security hardening. source_endpoint is stripped of URL query strings, fragments and userinfo at ingestion, so secrets in request URLs no longer reach stored findings, the query API, the archive or the ack signature. GET /api/acks is gated by [daemon.ack] api_key when set. /api/export/report evaluates the real quality gate instead of hardcoding passed:true. verify-hash verifies binary provenance via gh attestation verify and its TRUSTED label now requires binary attestation to be verified when the report carries attestation metadata. Migration: acks on endpoints that carried a query string must be re-captured after upgrade, and verify-hash on an attested report caps at PARTIAL without --verify-binary. No chart template change."
    - kind: added
      description: "appVersion 0.9.15: the chart documents how to restrict who may acknowledge findings on the pod-network bind. Front the API with an SSO proxy for per-group control, or set a shared [daemon.ack] api_key sourced from a Secret via the PERF_SENTINEL_ACK_API_KEY environment variable. A non-loopback bind logs a startup advisory and the daemon has no embedded IAM by design. Values comments and post-install notes only, no template change."
    - kind: added
      description: "appVersion 0.9.14: green_summary.database_waste now exists on every run. When no Alumet measurement of the database cgroup is available (batch runs, managed databases, no [green.alumet.database]), the figure is estimated from the modeled energy of the window's SQL spans and tagged model=estimated, so the database-side waste is surfaced even without a measured backend. A declared database with no delivered reading emits nothing (its energy carries over, no double count). The figure now shows on the batch text report and the HTML dashboard Green panel, not only the daemon. No chart template change, this bump tracks the new appVersion."
    - kind: added
      description: "appVersion 0.9.14: periodic disclosure schema v1.4 publishes aggregate.database_waste at both thresholds (operator and binary-pinned canonical) with its provenance models and the measured/estimated split (measured_energy_kwh, measured_windows, estimated_windows, windows_with_carbon). An informational lower bound kept out of every energy and carbon total. The per-window archive carries the matching disclosure_waste.database block. No chart template change, this bump tracks the new appVersion."
    - kind: added
      description: "appVersion 0.9.13: [green.alumet.database] declares the database cgroup measured by Alumet (label_value, optional region). The watch daemon multiplies that cgroup's measured window energy by the SQL-only waste ratio and reports green_summary.database_waste, a CPU-only lower bound excluded from energy_kwh, co2 and the public disclosure. green_summary also gains total_sql_io_ops and avoidable_sql_io_ops (the SQL share of the I/O op counts), and the query monitor Energy tab shows a database waste line. No chart template change, this bump tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.9.13 (config compat break): unknown keys and subsection names under [green.alumet] are now rejected at config load instead of being silently ignored, so a typo like [green.alumet.databse] fails loudly. A config carrying a stray or typo'd key under that section stops loading after the upgrade; remove the key. No chart template change."
    - kind: added
      description: "appVersion 0.9.12: Alumet joins as a sixth opt-in measured-energy backend ([green.alumet], scraping the prometheus-exporter plugin), at the top of the measured precedence chain (alumet_rapl above scaphandre_rapl). The chart's prometheusRule.energyScrapers staleness alerts cover the new perf_sentinel_alumet_last_scrape_age_seconds gauge alongside the four existing backends. GET /api/energy returns six backend rows instead of five, reordered with alumet first, so consumers indexing rows by position must read the backend name instead."
    - kind: changed
      description: "appVersion 0.9.12: Kepler cumulative counters sharing a service_mappings label value (one container name repeated across pods) are summed before the per-window delta instead of a last-write-wins read, and both the Kepler and Alumet scrapers emit a distinct warn-once when samples flow but no service_mappings value matches the wire. The workspace toolchain moves to Rust 1.97.1."
    - kind: changed
      description: "appVersion 0.9.11: the dashboard consolidates its five per-tab search inputs into one global search box in the top bar that filters every searchable tab at once (Findings, pg_stat, mysql_stat, Diff, Correlations), with per-tab match counts in the sidebar badges and a query that survives tab switches. Findings match on the type label shown on the row, and each tab's Export CSV downloads the rows its query left visible. No chart template change, this bump tracks the new appVersion."
    - kind: fixed
      description: "appVersion 0.9.11: cross-trace correlation clicks open a coherent target-side detail with a highlighted span, the live-mode findings count and sidebar badge match the visible rows (excluding acknowledged findings), wide tables scroll instead of clipping on narrow viewports, and the Diff and Correlations tabs gain empty-state messages and honest header counts. No chart template change, this bump tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.9.10: the HTML dashboard is reskinned to the hi-fi design handoff. DM Sans and JetBrains Mono replace Geist as the embedded brand fonts (OFL-1.1, latin subsets), flat pastel fills replace every gradient, and the sidebar nav, buttons, cards, modals and daemon status dots all move onto the theme tokens. Overview KPI cards are now semantic and clickable: the Findings card is a solid color driven by the highest severity present, the card beside it promotes that severity, and the delta-baseline card tints on the net regression or improvement direction. No chart template change, this bump tracks the new appVersion."
    - kind: added
      description: "appVersion 0.9.10: the dashboard gains sortable tables (click cycles descending, ascending and default order, Shift+click adds a tie-breaker, the sort persists per table and travels with Copy link), a comfort/compact density toggle persisted in the browser, search-match highlighting, and an Undo button on the acknowledgment toast. No chart template change, this bump tracks the new appVersion."
    - kind: fixed
      description: "appVersion 0.9.10: the Acknowledgments tab badge no longer shows a stale zero next to the live count, the trace tree tints its highlight by finding severity and no longer dims every row for whole-trace findings, and in live mode only the Ack button swallows row clicks so the band around it no longer blocks opening a finding. No chart template change, this bump tracks the new appVersion."
    - kind: fixed
      description: "appVersion 0.9.9: slow_sql now fires for services instrumented by the PHP OTel contrib packages (Symfony + Doctrine + PDO). Those packages split each query across a statement-bearing SELECT orders span (db.query.text, ~0 ms) and its statement-less Doctrine::execute sibling carrying the real duration, with db.system.name only on the pdo child, so OTLP conversion previously dropped every duration-bearing span as missing_db_statement and such services never produced a slow SQL event. A stitch pass at OTLP conversion re-joins each query into one event carrying the statement and the real duration; merged spans count under the new merged_db_span reason of perf_sentinel_otlp_spans_filtered_total. Single-layer emitters (Laravel, Django, Rails) are unchanged. No chart template change, this bump tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.9.8 (breaking, HTTP acknowledgment signatures reset): the HTTP normalizer now keeps the callee host in the grouping template for DNS-addressed calls (GET user-svc/api/users/{id} instead of GET /api/users/{id}), so two calls to the same path on different backend services no longer collapse into a false redundant_http. IP-literal authorities (IPv4 and bracketed IPv6) are still stripped so load-balanced pod replicas keep deduping, the port and RFC 3986 userinfo are dropped, a trailing DNS root dot is canonicalized, and the host is lowercased. Because the finding signature hashes pattern.template, every outbound-HTTP finding's signature changes, so existing HTTP acknowledgments must be re-created (SQL and RPC findings are unaffected). No chart template change, this bump tracks the new appVersion."
    - kind: added
      description: "appVersion 0.9.8: OTLP ingest now admits RPC spans (OTel RPC semconv rpc.system/rpc.service/rpc.method, the standard gRPC and RPC-framework shape). These carried neither db.statement/db.query.text nor http.url/url.full, so the I/O filter dropped every one as non-I/O and the topological detectors (excessive_fanout, chatty_service, serialized_calls) plus the occurrence detectors were blind on gRPC-heavy fleets. RPC spans are keyed on rpc.system and modeled as outbound calls (target rpc.service/rpc.method, span-name fallback), admitting only SpanKind::Client so the inbound SERVER handler span is not double-counted. Admission-only reuse of the HTTP normalize path, so findings surface under the _http types and n_plus_one_sql never applies. No chart template change, this bump tracks the new appVersion."
    - kind: fixed
      description: "appVersion 0.9.7: batch analyze --input now accepts OTLP/JSON list attributes serialized the canonical protobuf JSON way, with the empty repeated field omitted (arrayValue:{} or kvlistValue:{}). Previously one such attribute failed the whole file with a missing values field and a non-zero exit, so nothing was analyzed. The OTLP/JSON reader keeps the strict typed parse as the fast path and backfills the omitted empty list only for the affected document. No chart template change, this bump tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.9.6: the embedded carbon-intensity table switches its nationally-gridded rows from Electricity Maps consumption-based 2023-2024 means to Ember yearly generation-based national data (latest year per country), regenerated semiannually by the new refresh-datasets workflow through a reviewed PR. Low-carbon grids move the most (Sweden 8 to 35.4, Finland 8 to 57.5, Norway 7 to 28.1 gCO2eq/kWh), the generation-vs-consumption accounting difference documented in docs/METHODOLOGY.md. Hourly profiles are renormalized to the new annual levels, shapes unchanged. The SPECpower instance table is now generated from the CCF coefficient CSVs (the m6a/c6a families align to the CCF EPYC 3rd Gen coefficient, 26 rows lose hand-rounding slips of at most 0.1 W). Carbon outputs shift for the affected regions. SPECPOWER_VINTAGE is unchanged, so operator TOMLs pinning specpower_table_version are unaffected. No chart template change, this bump tracks the new appVersion."
    - kind: added
      description: "appVersion 0.9.5: the binary adds OTLP JSON auto-detection to batch analyze --input (single object or Collector file exporter NDJSON, reusing the daemon conversion path) and a new mysql-stat subcommand ranking MySQL hotspots from performance_schema.events_statements_summary_by_digest exports, with a matching mysql_stat tab in the self-contained HTML dashboard via report --mysql-stat. An opt-in daemon memory-pressure guard ([daemon] memory_high_water_pct, default off) rejects OTLP ingest when cgroup v2 memory crosses the configured high-water mark, bounding RSS against OOM. Toolchain moves to Rust 1.96.1."
    - kind: added
      description: "Chart alerting: new PerfSentinelMemoryPressureRejecting PrometheusRule, and PerfSentinelIngestRejecting is now scoped to reason=channel_full, so a memory-guard rejection points operators at resources.limits.memory rather than the ingest queue."
    - kind: added
      description: "appVersion 0.9.4: the daemon binary adds PHP framework-aware suggested_fix. Findings on Laravel/Eloquent and Symfony/Doctrine stacks (detected via the native io.opentelemetry.contrib.php.* instrumentation scopes or a .php source path) carry framework-specific remediation, with a PHP generic fallback across all ten anti-patterns. The sanitizer-aware N+1 classifier now treats the Laravel and Doctrine scopes as ORM markers, so an obfuscated Eloquent/Doctrine N+1 classifies as n_plus_one_sql under the default auto mode. dd-trace-php bridged through the Collector datadogreceiver carries no framework signal. No chart template change."
    - kind: added
      description: "appVersion 0.9.3: the daemon binary adds a Datadog / dd-trace ingestion path. Teams with no OpenTelemetry SDK can bridge dd-trace through an OTel Collector running the datadogreceiver, and perf-sentinel reads the SQL from dd.span.Resource natively. It also recognizes the stable OTel 1.27+ db.system.name attribute across the OTLP, Jaeger and Zipkin ingest paths, with consistent engine-label canonicalization. No chart template change."
    - kind: changed
      description: "appVersion 0.9.2: the daemon binary adds Ruby/Active Record framework-aware suggestions (detected via the OpenTelemetry::Instrumentation::ActiveRecord scope or a .rb source path), drops non-SQL datastore spans (Redis, MongoDB and similar) at ingestion under a dedicated non_sql_datastore OTLP filter reason kept out of the zero-retention warning, tokenizes MySQL backtick identifiers, and stops embedding the raw db.statement in the self-contained HTML report (closing a SQL-literal leak). No chart template change."
    - kind: security
      description: "appVersion 0.9.1: the daemon binary updates opentelemetry_sdk to 0.32.1, resolving CVE-2026-48504 (unbounded memory allocation in W3C Baggage propagation). No chart template change."
    - kind: changed
      description: "appVersion 0.9.0: the self-contained HTML dashboard is rebuilt as an application shell (sidebar navigation, Overview landing page, Findings master/detail with the Explain trace tree inline, severity-tinted KPI cards, syntax highlighting, embedded Geist fonts). The chart version is realigned to track appVersion (both 0.9.0), replacing the independent 0.2.x line. No chart template change."
    - kind: changed
      description: "appVersion 0.8.14: the HTML dashboard dark theme darkens its secondary panel background from #2c2c2c to #212121, giving metric cards, rows and the topbar more contrast against the primary background. Cosmetic, dark theme only. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.7.4: two opt-in measured-energy sources extend the carbon attribution stack on ARM64 and bare-metal hosts. Kepler (kepler_ebpf) reads eBPF per-container or per-process joule counters. Redfish BMC (redfish_bmc) reads chassis wall-plug watts via the baseboard management controller and attributes them per service proportionally to ops-deltas. The carbon precedence chain becomes electricity_maps_api > scaphandre_rapl > kepler_ebpf > redfish_bmc > cloud_specpower > io_proxy_v3 > io_proxy_v2 > io_proxy_v1. Two new Prometheus gauges are exposed: perf_sentinel_kepler_last_scrape_age_seconds and perf_sentinel_redfish_last_scrape_age_seconds."
    - kind: fixed
      description: "appVersion 0.7.5: align the Kepler scraper to the Kepler v2 upstream metric names (Kepler >= 0.10). The container variant now reads kepler_container_cpu_joules_total (was kepler_container_joules_total). The previous process_package and process_dram metric_kind values targeted metrics that Kepler never published and are removed: use metric_kind = 'process' which reads kepler_process_cpu_joules_total keyed by the comm label. Operators with these legacy values in their .perf-sentinel.toml get a config-load error pointing at the replacement, no silent fallback. The Process variant also caps service_mappings label values at 15 chars to match the kernel's TASK_COMM_LEN truncation. The scraper warns once when an apparently healthy endpoint returns zero matching samples for three consecutive ticks, catching the legacy-Kepler upgrade pitfall. Redfish BMC integration unchanged."
    - kind: changed
      description: "appVersion 0.7.6: two config breaking changes on Scaphandre and Redfish to eliminate silent over-attribution. Scaphandre `process_map` becomes a typed table per service with `exe_contains` plus optional `cmdline_contains` substrings, replacing the previous flat `\"service\" = \"exe\"` form. Substring matching on both labels disambiguates co-located JVMs or .NET assemblies sharing a runtime. Redfish `endpoints` becomes a typed table per chassis with `url` plus `schema` enum (`legacy_power` or `environment_metrics`), the top-level `power_path` field is removed. EnvironmentMetrics (`PowerWatts.Reading`) is now natively supported alongside the legacy `/Power` resource. Both new struct shapes deny unknown TOML fields. Scaphandre adds a zero-sample warn-once net that catches silent upstream renames of the metric or the `exe` label at runtime, mirroring the Kepler net from 0.7.5, and the staleness gauge now climbs from boot on failure parity with Kepler. Wire-conformance CI extended to assert both Scaphandre cmdline disambiguation and Redfish dual-schema parsing against the real upstream binaries."
    - kind: fixed
      description: "appVersion 0.7.7: closes an N+1 SQL detection gap on non-Java stacks. The sanitizer-aware classifier and the SQL normalizer assumed JDBC-style ? placeholders, so Go (pgx $1), Python (psycopg %s, SQLAlchemy :name), .NET (@param) and any stack sending pre-parameterized SQL to the wire was classified as redundant_sql instead of n_plus_one_sql. Sequentiality is now evaluated in microseconds, so sub-millisecond n+1 and serialized-calls patterns no longer slip the gate, strict sanitizer-aware mode reaches parity with auto on bare-driver stacks, and suggested_fix coverage broadens from 3 to 10 anti-patterns across 6 language ecosystems (96 entries, Python, Go and Node.js/TypeScript join Java, C#, Rust). Operators with strict quality_gate rules should re-baseline n_plus_one_sql_critical_max, serialized_calls_critical_max and pool_saturation_critical_max, previously redundant_sql warnings may resurface as n_plus_one_sql criticals (same defects, sharper label)."
    - kind: added
      description: "appVersion 0.7.8: closes the suggested_fix coverage gaps from the v0.7.7 lab and extends N+1 detection to HTTP. Vendor-specific OTel scope recognition resolves a framework for scopes outside the io.opentelemetry.* convention (.NET EF Core via OpenTelemetry.Instrumentation.EntityFrameworkCore or Microsoft.EntityFrameworkCore, Quarkus via io.quarkus.*). A last-resort service-name fallback infers the framework from a distinctive substring in the service name when scopes and code_location are absent. HTTP N+1 sanitizer-aware classification reclassifies same-URL high-occurrence HTTP groups with timing variance from redundant_http to n_plus_one_http. No config, CLI, daemon wire, or report JSON change. Known limitation documented: OpenTelemetry .NET redacts the query string to ?* by default, so query-parameter HTTP N+1 loops stay redundant_http unless OTEL_DOTNET_EXPERIMENTAL_HTTPCLIENT_DISABLE_URL_QUERY_REDACTION=true is set."
    - kind: added
      description: "appVersion 0.8.0: the inspect TUI becomes a unified multi-view interface. Two views join the existing Inspect browser, Analyze (GreenOps summary with I/O waste ratio, top offenders, quality gate, findings by severity) and Explain (the selected trace's annotated span tree, full screen). Enter descends Analyze -> Inspect -> Explain and Esc ascends back. analyze --tui and explain --tui open the TUI directly, their default stdout output is unchanged because --tui conflicts with --format and --ci. Under query inspect the Analyze view is fed live from /api/export/report, degrading to a hint on older daemons. No chart template change, this bump only tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.8.1: patch release with no daemon-facing change. The SQL tokenizer slice path gains a debug-only char-boundary assertion (compiled out in release) as a refactor guard, disclose state initialization is simplified, and the release profile rationale now documents why overflow-checks stays off in release. Remaining changes are release tooling (Helm chart release automation script) and documentation. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.2: the periodic public disclosure reports avoidable energy and carbon at two N+1 thresholds side by side, canonical_waste (a threshold pinned in the binary that the operator cannot configure, so the disclosed waste figure is non-manipulable) and operational_waste (the operator's configured threshold), schema perf-sentinel-report/v1.1. The flat avoidable fields alias the canonical tier and the change is additive, v1.0 readers remain valid. Also bumps the TUI backend to ratatui 0.30.1. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.3: the periodic public disclosure gains a temporal-coverage continuity signal (aggregate.temporal_coverage, schema perf-sentinel-report/v1.2) that reports how many of the declared period's calendar days carried measurements, so a reader can tell a continuously-measured period from one where the daemon ran only a few days. Archiving is traffic-gated so the figure is a lower bound on activity, not daemon uptime, surfaced as a warning and an in-band disclaimer, never a hard official gate. Also adds an in-band coverage_basis provenance marker and reserves an integrity.cross_period_log hook. The schema change is additive, v1.1 and v1.0 readers remain valid. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.4: a man subcommand renders the perf-sentinel manual page to stdout (perf-sentinel man, backed by clap_mangen), mirroring the existing completions subcommand. Every user-facing command's --help now carries copy-pasteable usage examples, and several command help texts were tightened. No chart template change, this bump only tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.8.5: a normal Kubernetes pod termination (SIGTERM from a rolling update or scale-down) now drains the daemon's in-flight streaming window through detection instead of dropping it, matching the existing SIGINT (Ctrl+C) behavior, via a shared shutdown-signal helper that also aborts in-flight Tempo fetches. Only an ungraceful kill (SIGKILL after the grace period, OOM) still loses the window, so set terminationGracePeriodSeconds above the daemon's window duration to benefit. The Windows daemon binary and core test suite also build and run now. No chart template change, this bump only tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.8.6: the daemon's ingestion channel and analysis-worker queue depths are now configurable via [daemon] ingest_queue_capacity and analysis_queue_capacity (both default 1024), and the base CarbonContext is shared across analysis batches by Arc instead of being deep-cloned on every evicted batch. No chart template change, this bump only tracks the new appVersion."
    - kind: changed
      description: "appVersion 0.8.7: four new daemon loss-observability counters (perf_sentinel_otlp_spans_received_total, perf_sentinel_otlp_spans_filtered_total by reason, perf_sentinel_service_io_ops_overflow_total, perf_sentinel_correlator_pairs_evicted_total) make previously silent drop paths visible; a primary-source audit refreshes the embedded carbon data (Paris regions 56 to 41 gCO2eq/kWh, Sao Paulo 62 to 96, Belgium 187 to 165, the eu-central-1 hourly profile rescaled from its stale 2022 level to the Electricity Maps 2024 level, generic PUE 1.2 to 1.5); and the limit-testing campaign hardens wide-topology and saturation behavior (correlator pair admission control fixes a 1500-service OOM, bounded OTLP decode concurrency (HTTP and gRPC) and a 2-second bounded enqueue wait keep /health responsive and rejections observable and retryable under flood, batch CLI inputs up to 1 GiB, HTML dashboard bounds embedded findings critical-first). A settings advisor emits tuning entries in Report.warning_details when lifetime counters show a config knob undersized for the observed load. Carbon outputs shift for the affected regions. Give the liveness probe headroom under sustained saturation (timeoutSeconds 5, failureThreshold 5). No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.8: query monitor, a new read-only live operator TUI (perf-sentinel query --daemon <URL> monitor) with five Tab-cycled tabs (settings-advisor hints, the effective energy/carbon mix per service and region, live Trends charts for energy, carbon and runtime headroom, per-backend energy-scraper health, and every [daemon] parameter with its default and an explanation), backed by two new read-only daemon endpoints (GET /api/config, an explicit allowlist that summarizes TLS and ack secrets to booleans and never echoes paths or keys, and GET /api/energy, per-backend scraper health), an extended GET /api/status (runtime caps and live depths), and six new scalar /metrics gauges (perf_sentinel_energy_kwh, perf_sentinel_carbon_gco2, perf_sentinel_max_active_traces, perf_sentinel_analysis_queue_capacity, perf_sentinel_max_retained_findings, perf_sentinel_stored_findings) with three matching Grafana panels. Terminal-output sanitization also strips BiDi and invisible characters, and the self-contained HTML dashboard embed is lighter. All additions are backward compatible. No chart template change, this bump only tracks the new appVersion."
    - kind: fixed
      description: "appVersion 0.8.9: the demo subcommand marks its failed quality-gate verdict as informational (Quality gate: FAILED (informational in demo, would exit 1 under analyze --ci)), since the demo never enforces the gate and always exits 0. Console-only and demo-only, analyze --ci exit behavior and machine exports (JSON, SARIF, HTML, NDJSON) are unchanged. The documented crates.io install command now recommends cargo install perf-sentinel --locked. CLI-only change, no daemon behavior change. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.10: the demo subcommand gains --tui and --html. perf-sentinel demo can now open the interactive TUI report or write the self-contained HTML dashboard in addition to the colored terminal report, and the --html output is a full showcase with every dashboard tab populated from embedded fixtures (findings across all detector types, Explain span trees, GreenOps, a pg_stat ranking, a Diff against an embedded baseline run, and synthesized cross-trace correlations). The embedded demo dataset now exercises all ten detector types across the three severity levels. CLI-only change, no daemon behavior change. No chart template change, this bump only tracks the new appVersion."
    - kind: added
      description: "appVersion 0.8.11: the interactive TUIs gain mouse-drag-resizable panels. The inspect drill-down (Traces, Findings, Correlations, Detail) and the query monitor Trends tab let you drag panel borders to redistribute space, m toggles mouse capture (opt-in, native copy-paste preserved when off), r resets the layout, and hovering a border highlights it with a handle glyph (a terminal cannot change the OS mouse pointer). Panel sizes are per-session, not persisted. No chart template change, this bump only tracks the new appVersion."
    - kind: fixed
      description: "Chart 0.2.57: enabling StatefulSet persistence now wires the daemon's durable state to the mounted PVC. The ConfigMap points [daemon.ack] storage_path at /var/lib/perf-sentinel/acks.jsonl and [daemon.archive] path at /var/lib/perf-sentinel/archive.ndjson whenever workload.kind is StatefulSet and workload.statefulset.persistence.enabled is true, so runtime acknowledgments and the public-disclosure archive survive pod restarts and rescheduling. Previously the volume mounted at /var/lib/perf-sentinel but nothing pointed at it, so the PVC stayed empty, the ack store fell back to a non-writable default under readOnlyRootFilesystem, and disclose archiving was off. The injection is gated on the volume actually being mounted because an unwritable archive path is a fatal startup error. No application change, appVersion stays 0.8.11."
    - kind: fixed
      description: "appVersion 0.8.12: the query monitor Trends tab plots its Energy, Carbon and headroom charts in a fixed-width time window instead of compressing the curves as history accumulates. Each new sample scrolls the curves leftward at a constant rate and the time-span axis labels stay put, and before the window fills its left part stays empty rather than zooming in on the few points collected so far. CLI/TUI-only change, no daemon behavior change. No chart template change, this bump only tracks the new appVersion."
    - kind: changed
      description: "Chart 0.2.59: the post-install notes now warn when workload.replicas exceeds 1 on a non-DaemonSet workload. perf-sentinel keeps per-trace and correlation state in memory, per pod, with no shared state, so a round-robin Service splits one trace's spans across pods and silently degrades N+1 and correlation detection. The note points operators at replicas=1 or trace-aware routing (consistent hashing by trace_id via the OTel Collector loadbalancingexporter). The default resource requests and limits are also raised to match the measured daemon footprint (requests 50m/64Mi, limits 500m/256Mi), which idles near 17Mi but holds 150-190Mi RSS under sustained ingestion, so the kernel no longer OOMKills the pod under load. No application change, appVersion stays 0.8.12."
    - kind: added
      description: "Chart 0.2.60: the chart now ships operator-facing alerting and disruption protection, both opt-in and off by default. An opt-in PrometheusRule (prometheusRule.enabled) packages the daemon's loss and saturation alerts (daemon unreachable via absent(perf_sentinel_active_traces), OTLP rejection, analysis shedding, analysis-queue saturation, findings store near cap, correlator-pair eviction, service-cardinality overflow, plus opt-in per-backend energy-scraper staleness under prometheusRule.energyScrapers), each alert naming the [daemon] knob to raise, with a prometheusRule.additionalRules passthrough for custom rules. An opt-in PodDisruptionBudget (podDisruptionBudget.enabled, default maxUnavailable 1 rather than minAvailable 1 so it does not wedge node drains on the single-replica daemon) adds voluntary-disruption protection. No application change, appVersion stays 0.8.12."
