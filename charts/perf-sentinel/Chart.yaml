apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.14.0
appVersion: "0.14.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.14.0. OVHcloud, Scaleway and 3DS OUTSCALE regions carry grid intensity and PUE, so a workload on any of the three scores instead of contributing zero operational CO2 from the unknown bucket. 65 Scaleway instance types also gain an embedded power profile, derived from the exact CPU its Product Catalog names per offer, and [green.cloud] accepts provider = scaleway."
    - kind: changed
      description: "The interactive TUI catches up with the dashboard on exploring findings: per-span timing, classification, observation window and confidence on a finding, severity filtering, sorting inside a trace, the report warnings at the top of the Analyze view and a top-findings-by-impact ranking. The dashboard severity pills combine instead of replacing each other, with a Clear filters button in their place."
    - kind: fixed
      description: "Both sides of a cross-trace correlation open their finding again and the pills carry their real severity, where the left side had been inert and every pill amber."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.14.0
      platforms:
        - linux/amd64
        - linux/arm64
