apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.23.0
appVersion: "0.23.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.23.0. The daemon counts slow occurrences across analysis batches: a template slow in `slow_query_min_occurrences` separate episodes within `[detection] slow_query_window_minutes` (default 15, `0` disables, range 0 to 60) yields a slow finding that folds with the batch ones, so a template slow in a few separate episodes, none of them enough on its own, now reports where it stayed in the duration histogram only. New counter `perf_sentinel_slow_window_keys_refused_total`. `GET /api/correlations` gains `source_sample_trace_id`, the trace of the source side of a pair."
    - kind: fixed
      description: "Cross-trace correlation pairs findings on their own timestamps instead of the analysis tick that produced them: `median_lag_ms` is no longer always 0, the earlier finding is the source, and `confidence` is no longer inflated by a source that left the window, so fewer pairs clear `min_confidence`. Pairing memory no longer grows with `window_minutes`, which is now validated between 1 and 10080 at config load when correlation is enabled: a `[daemon.correlation]` block outside that range stops the daemon at startup."
    - kind: changed
      description: "Terminal output shows times in the local time zone, and a `TZ` naming a zone the image lacks resolves against a database embedded in the binary. The two example Grafana dashboards, not shipped in the chart, move to version 10 (overview) and 9 (findings): browser time zone, a `Finding type` variable, `Source trace` and `Target trace` columns. No values.yaml key is added or removed, no template changes, no shipped alert changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.23.0
      platforms:
        - linux/amd64
        - linux/arm64
