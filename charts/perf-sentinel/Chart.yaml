apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.22.2
appVersion: "0.22.2"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.22.2. A trace rooted in a message consumer no longer reports `unknown` as its endpoint when no application code frame sits above the I/O, the usual shape of a Spring AMQP or Kafka listener under the OpenTelemetry Java agent. The endpoint falls back to the destination of the nearest consumer span, `<messaging.system> <destination>`, on OTLP, Jaeger and Zipkin, and the daemon retains consumer destinations across exports so a consumer span that closes after its children still names them. Every finding of every listener in a service had shared one endpoint, so acking one hid the others. The two example Grafana dashboards move to version 8 (overview) and 5 (findings, with a Correlations table on GET /api/correlations). No values.yaml key is added or removed, no template changes, no shipped alert changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.22.2
      platforms:
        - linux/amd64
        - linux/arm64
