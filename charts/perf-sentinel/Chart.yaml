apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.15.0
appVersion: "0.15.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.15.0. The daemon counts the per-window disclosure archive entries it drops instead of writing, by reason, and stamps the running total into each archived line, so disclose can report windows_dropped and drop_counter_resets for the period. The hash chain only advances on a successful write, so a dropped window used to leave no hole for verify-hash to find."
    - kind: changed
      description: "diff pairs a template mutation as one mutated finding instead of one resolved plus one new, so a schema refactor no longer fails a gate fed by new_findings. pg-stat and mysql-stat cross-reference against every SQL template the traces carried rather than only the ones that produced a finding, and pg-stat --baseline estimates tracing coverage from two snapshots framing the window."
    - kind: fixed
      description: "A rotation while the daemon is writing can no longer truncate the disclosure archive to nothing: the byte count resyncs from the open descriptor rather than the path, which a rename maps to a file that does not exist yet."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.15.0
      platforms:
        - linux/amd64
        - linux/arm64
