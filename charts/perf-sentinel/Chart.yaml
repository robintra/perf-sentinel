apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.16.0
appVersion: "0.16.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.16.0. tempo and jaeger-query accept an absolute search window, --from and --to in ISO 8601 UTC, for re-reading the exact window an incident happened in rather than one that drifts with the clock. The lookback parser also accepts a d suffix."
    - kind: fixed
      description: "jaeger-query --service no longer searches from the Unix epoch. It sent the window as lookback, which Victoria Traces reads only on its service-graph endpoint and never on /api/traces, so the parameter was dropped and every relative query returned whatever the store held over all of history. Both window forms now send explicit start and end."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.16.0
      platforms:
        - linux/amd64
        - linux/arm64
