apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.13.1
appVersion: "0.13.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.13.1. The daemon config gains max_export_findings, which sizes the /api/export/report slice independently of the browsing cap on /api/findings, so a daemon retaining tens of thousands of findings can ship more than 1000 of them. Startup warns when it and max_retained_traces together project a snapshot past the 8 MiB body limit the query clients read it with."
    - kind: changed
      description: "The exported snapshot states its own scope in warning_details, so a reader cannot take the capped finding slice and the per-batch green figures for one population. The HTML dashboard groups the findings filters into one menu per family, each accepting several values."
    - kind: fixed
      description: "An oversized snapshot reports the read limit instead of reading as an unreachable daemon, and long SQL statements wrap in the pg_stat and mysql_stat tables instead of scrolling their card sideways."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.13.1
      platforms:
        - linux/amd64
        - linux/arm64
