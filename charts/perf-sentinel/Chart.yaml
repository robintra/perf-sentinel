apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.25.1
appVersion: "0.25.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.25.1. A driver ping no longer counts as a `missing_db_statement` gap. The empty statement a connection pool runs through `PgConnection.isValid()` before lending an idle connection, traced by the OpenTelemetry JDBC instrumentation with `db.statement=\"\"`, is now filtered as `not_io`, so a Java service behind a pool no longer shows its pings as spans missing their statement, and they no longer lower its usable span ratio."
    - kind: fixed
      description: "The example incident alerting rules, not shipped in the chart, drop the pods a Job owns from the OOM, restart and memory-saturation rules, through `kube_pod_owner{owner_kind=\"Job\"}`. A trivy-operator scan Job names its container after the container it scans, so a scan pod that restarted could post an incident with no finding. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.25.1
      platforms:
        - linux/amd64
        - linux/arm64
