apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.25.5
appVersion: "0.25.5"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.25.5. The daemon's API and its metrics do not change. On MySQL and MariaDB a double-quoted value is now masked, so those findings change signature and their acknowledgments stop matching. The perf-sentinel CLI in the image falls back to the v3 search on Jaeger 2.21 and later."
    - kind: added
      description: "The daemon routes its https:// calls through HTTPS_PROXY, ALL_PROXY and NO_PROXY and trusts the certificates of SSL_CERT_FILE, set through extraEnv and extraVolumes. A pod that already carries HTTPS_PROXY now uses it, so an in-cluster https:// endpoint belongs in NO_PROXY."
    - kind: added
      description: "networkPolicy.ingress.otlpGrpc and networkPolicy.ingress.http open port 4317 or port 4318 alone, so a gRPC-only collector no longer reaches the query API served on 4318. The lists directly under networkPolicy.ingress still open both ports. The policy stays off by default."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.25.5
      platforms:
        - linux/amd64
        - linux/arm64
