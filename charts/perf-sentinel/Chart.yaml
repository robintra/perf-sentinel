apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.25.0
appVersion: "0.25.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.25.0. `GET /api/incidents` takes `findings=false`, which returns each incident without its frozen findings and with `finding_count` in their place, by `id` as well as by page. The default response is unchanged."
    - kind: fixed
      description: "An incident carrying a namespace froze the findings of its service in every namespace, so a rollout across tenants recorded one incident per namespace, each holding every tenant's findings. The freeze now leaves out a finding whose `k8s.namespace.name` grouping attribute names another namespace, which needs that attribute among `[detection] grouping_attributes`, as it is by default. The daemon warns at startup when incidents are enabled without it."
    - kind: fixed
      description: "The example findings dashboard, not shipped in the chart, moves to version 12: its `Incidents` table asks with `findings=false` and reads `finding_count`, instead of pulling every frozen finding of 50 incidents on each refresh, which Grafana's Infinity backend parser inflated past a 1 GiB memory limit. No values.yaml key is added or removed, and no template changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.25.0
      platforms:
        - linux/amd64
        - linux/arm64
