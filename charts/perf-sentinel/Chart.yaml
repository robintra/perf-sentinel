apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.13.0
appVersion: "0.13.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.13.0. The pg-stat and mysql-stat Prometheus scrapes join every counter the exporters publish as a series of its own, so the rankings by calls and by rows examined carry real figures instead of zeros. New flags name or skip each series and state what the time series counts."
    - kind: fixed
      description: "The daemon re-reads its TOML acknowledgments file every minute, so an edit to a mounted ConfigMap applies without restarting the pod, and a ConfigMap projection is no longer refused as a symlink. Mount the ConfigMap as a directory rather than with subPath, which freezes the file against that reload."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.13.0
      platforms:
        - linux/amd64
        - linux/arm64
