apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.25.3
appVersion: "0.25.3"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.25.3. The daemon no longer warns at every start that it could not tighten the ack store directory to 0700. The chart puts the ack store at the root of its volume, which belongs to root under the pod's `fsGroup`, so that chmod always failed. That case now logs at `debug`, and the ack file keeps its 0600 mode."
    - kind: fixed
      description: "Findings from a Spring Boot service traced through Micrometer Observation now get the Java suggested fix, and a SELECT that Hibernate generated gets the JPA one even when no span names Hibernate. Finding signatures do not change, so acknowledgments keep matching."
    - kind: fixed
      description: "The daemon logs each configuration advisory once at start. The chart's default config.toml listens on 0.0.0.0, so every pod printed the non-loopback listen advisory twice."
    - kind: changed
      description: "The comments of values.yaml, the templates and the chart README are reworded. The default config.toml comments are rendered into the ConfigMap, so `checksum/config` changes. No values.yaml key is added or removed, and no template logic changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.25.3
      platforms:
        - linux/amd64
        - linux/arm64
