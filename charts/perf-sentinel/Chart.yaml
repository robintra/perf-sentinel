apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.17.0
appVersion: "0.17.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.17.0. The cross-trace correlator no longer gets a memory-limited daemon OOM-killed on a wide topology. One batch collected every pair it refused at the max_tracked_pairs cap into a set sized by the batch times the lag window rather than by the cap, which reached tens of MiB inside a single call. Operators running correlation on a small memory limit no longer need to disable it, and lowering the cap was never the workaround it looked like."
    - kind: added
      description: "tempo and jaeger-query accept --sort, the severity and impact keys analyze already took, applied before the sinks so a wide sweep comes back ranked instead of leaving the caller to re-sort it."
    - kind: changed
      description: "The dashboard and the TUI open on impact rather than on severity and trace-id order. A reader arriving on a report asks what costs the most, and the answer now leads."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.17.0
      platforms:
        - linux/amd64
        - linux/arm64
