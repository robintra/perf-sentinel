apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.20.0
appVersion: "0.20.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: changed
      description: "appVersion 0.20.0. The daemon it ships accepts Alertmanager webhooks on POST /api/incidents behind the opt-in [daemon.incidents] section, freezes the findings of the window before a restart or a memory event, and lists them on GET /api/incidents. A new [daemon] read_api_key opens GET /api/acks and GET /api/incidents without the power to write, the key to give Grafana and the Hub, and the environment overrides now apply without a mounted config too. The values.yaml TOML gains commented guidance for both, and its ingress comment no longer claims the shared key leaves every read open. No values.yaml key is added or removed, no template changes, no shipped alert changes."
    - kind: added
      description: "Four metrics: perf_sentinel_incidents_total by kind, perf_sentinel_incidents_rejected_total by reason, perf_sentinel_incidents_archive_failed_total, and perf_sentinel_service_last_span_timestamp_seconds per service, the Unix stamp of the last span admitted so time() minus the gauge is an age that survives a daemon restart. The overview dashboard grows to 30 panels and the findings dashboard on the query API gains two incident tables behind a datasource carrying the read key. Three keys come from Secrets through extraEnvFrom, PERF_SENTINEL_ACK_API_KEY, PERF_SENTINEL_INCIDENTS_API_KEY and PERF_SENTINEL_READ_API_KEY, and an enabled [daemon.incidents] without its key stops the daemon at startup, so create the Secret first."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.20.0
      platforms:
        - linux/amd64
        - linux/arm64
