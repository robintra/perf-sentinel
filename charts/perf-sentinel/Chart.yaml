apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.20.1
appVersion: "0.20.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: fixed
      description: "appVersion 0.20.1. The daemon it ships no longer refuses to start when the incident archive on a persistent volume comes back with a group bit. Mounting a volume under an fsGroup adds g+rw to the files already on it, and this chart sets fsGroup 65534 by default, so a daemon that had captured incidents met a mode it rejected on its next start and stayed in CrashLoopBackOff with no way out but a manual chmod. It now chmods an archive it owns back to 0600 and still refuses one owned by another user. The per-window analysis archive and what it rotates into are also created 0600 instead of at the container umask, which left them world-readable at 0644. No values.yaml key is added or removed, no template changes, no shipped alert changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.20.1
      platforms:
        - linux/amd64
        - linux/arm64
