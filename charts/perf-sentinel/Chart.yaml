apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.21.0
appVersion: "0.21.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "appVersion 0.21.0. GET /api/findings accepts grouping, an exact match on the value the grouping Prometheus label already carries, and offset, so a fleet whose distinct signatures outgrow the 1000-row cap is readable past its newest thousand. An empty filter value now means no filter, which is what lets a Grafana All option reach an exact-match API, where it previously matched the empty string and returned nothing. The shipped findings dashboard gains Grouping, Service and Skip rows variables and a Grouping column, and the overview dashboard names the finding types behind its two avoidable-I/O panels. A serialized_calls suggestion names the block instead of carrying it, which cut one measured page from 5 MB. No values.yaml key is added or removed, no template changes, no shipped alert changes."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.21.0
      platforms:
        - linux/amd64
        - linux/arm64
