apiVersion: v2
name: perf-sentinel
description: |
  Lightweight polyglot performance anti-pattern detector for distributed
  traces. Detects N+1 queries, redundant calls, chatty services, connection
  pool saturation, serialized parallelizable calls, fanout. Scores I/O
  intensity per endpoint (GreenOps).
type: application
version: 0.19.0
appVersion: "0.19.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/robintra/perf-sentinel
icon: https://raw.githubusercontent.com/robintra/perf-sentinel/main/logo/logo-horizontal.svg
sources:
  - https://github.com/robintra/perf-sentinel
keywords:
  - performance
  - n-plus-one
  - observability
  - opentelemetry
  - greenops
maintainers:
  - name: robintra
    url: https://github.com/robintra
annotations:
  category: Observability
  licenses: AGPL-3.0-only

  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/robintra/perf-sentinel
    - name: Documentation
      url: https://github.com/robintra/perf-sentinel/tree/main/docs
    - name: Helm deployment guide
      url: https://github.com/robintra/perf-sentinel/blob/main/docs/HELM-DEPLOYMENT.md
  artifacthub.io/changes: |
    - kind: changed
      description: "appVersion 0.19.0. perf_sentinel_findings_total, perf_sentinel_slow_duration_seconds and the three per-service I/O counters gain a grouping label next to service, holding the analysed traffic's namespace by default, so a query that matches any of them without aggregating now returns one series per (service, grouping) pair. Wrap it in sum() or sum by (service) to keep the 0.18.0 shape, or set per_grouping_labels = false in the daemon config. The chart itself is unchanged, and its PrometheusRule matches none of the five metrics, so no shipped alert changes."
    - kind: added
      description: "The daemon config takes per_grouping_labels, default true, the grouping twin of per_service_labels, and exposes three counters that report how many attributions folded into grouping=\"_other\" at the per-run caps on admitted (service, grouping) pairs. No alert ships on any of them, and no values.yaml key is added or removed."
  artifacthub.io/images: |
    - name: perf-sentinel
      image: ghcr.io/robintra/perf-sentinel:0.19.0
      platforms:
        - linux/amd64
        - linux/arm64
